<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinemo — Movie & TV Tracker</title>

<style>
:root{
  --bg:#080a0f;
  --panel:#11151e;
  --panel2:#171c28;
  --card:#121620;
  --border:#222834;
  --text:#f3f4f6;
  --muted:#9ca3af;
  --gold:#fbbf24;
  --shadow:0 20px 50px rgba(0,0,0,.6);
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding-bottom:50px;
}

button, select, input{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

.hidden{
  display:none!important;
}

/* ============================================================
   TOP FLOATING PILL NAVIGATION
============================================================ */

.top-pill-wrapper{
  position:sticky;
  top:16px;
  z-index:2000;
  display:flex;
  justify-content:center;
  padding:0 15px;
  pointer-events:none;
}

.pill-nav{
  pointer-events:auto;
  display:inline-flex;
  align-items:center;
  background:rgba(18, 21, 30, 0.88);
  border:1px solid rgba(255, 255, 255, 0.12);
  border-radius:40px;
  padding:6px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(20px);
  gap:4px;
}

.pill-btn{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 22px;
  border-radius:30px;
  border:0;
  background:transparent;
  color:#9ca3af;
  font-size:13px;
  font-weight:700;
  transition:all .25s cubic-bezier(0.4, 0, 0.2, 1);
}

.pill-btn:hover{
  color:#fff;
}

.pill-btn.active{
  background:#2e3444;
  color:#ffffff;
  box-shadow:0 4px 14px rgba(0,0,0,.4);
}

.pill-icon{
  width:18px;
  height:18px;
  fill:currentColor;
  display:inline-block;
  flex-shrink:0;
}

/* ============================================================
   16:9 HERO SLIDER SECTION
============================================================ */

.hero-wrapper{
  width:100%;
  aspect-ratio:16/9;
  max-height:540px;
  position:relative;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:32px;
  background:#11151e;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
}

.hero-slide{
  position:absolute;
  inset:0;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.7s ease-in-out;
  z-index:1;
}

.hero-slide.active{
  opacity:1;
  pointer-events:auto;
  z-index:2;
}

.hero-backdrop{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center top;
  display:block;
}

.hero-gradient{
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(8,10,15,0.1) 0%, rgba(8,10,15,0.95) 100%),
             linear-gradient(90deg, rgba(8,10,15,0.85) 0%, rgba(8,10,15,0.2) 65%);
}

.hero-content{
  position:absolute;
  bottom:28px;
  left:28px;
  right:28px;
  z-index:3;
  max-width:650px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:12px;
}

.hero-title{
  font-size:32px;
  font-weight:900;
  margin:0;
  color:#fff;
  line-height:1.15;
  text-shadow:0 3px 12px rgba(0,0,0,0.9);
}

.hero-meta-row{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px;
  font-size:13px;
}

.hero-overview{
  font-size:13px;
  color:#d1d5db;
  line-height:1.5;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  text-shadow:0 2px 6px rgba(0,0,0,0.8);
  margin:0;
}

.hero-cta-btn{
  background:#fff;
  color:#000;
  border:0;
  padding:10px 22px;
  border-radius:10px;
  font-weight:800;
  font-size:13px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:4px;
  transition:transform .2s, background .2s;
}

.hero-cta-btn:hover{
  background:#e5e7eb;
  transform:scale(1.03);
}

.hero-dots{
  position:absolute;
  bottom:16px;
  right:24px;
  z-index:4;
  display:flex;
  gap:8px;
}

.hero-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:rgba(255,255,255,0.3);
  border:0;
  padding:0;
  transition:all .3s;
}

.hero-dot.active{
  background:#fff;
  width:24px;
  border-radius:10px;
}

/* ============================================================
   SEARCH OVERLAY MODAL
============================================================ */

.search-modal{
  position:fixed;
  inset:0;
  z-index:6000;
  background:rgba(8,10,15,.95);
  backdrop-filter:blur(20px);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:60px 20px 20px;
}

.search-modal-close{
  position:absolute;
  top:20px;
  right:20px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);
  color:#fff;
  border-radius:50%;
  width:38px;
  height:38px;
  font-size:16px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.search-box-large{
  width:100%;
  max-width:650px;
  position:relative;
}

.search-input-large{
  width:100%;
  background:#171c28;
  border:1px solid var(--border);
  border-radius:16px;
  color:#fff;
  padding:16px 20px 16px 52px;
  font-size:16px;
  outline:none;
}

.search-input-large:focus{
  border-color:#4b5563;
}

.search-icon-inside{
  position:absolute;
  left:18px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
}

.search-results-list{
  width:100%;
  max-width:650px;
  margin-top:15px;
  max-height:60vh;
  overflow-y:auto;
  border-radius:16px;
  background:#121620;
  border:1px solid var(--border);
}

.search-item{
  display:flex;
  gap:14px;
  align-items:center;
  padding:12px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
  transition:background .2s;
}

.search-item:hover{
  background:#1a202c;
}

.search-item img{
  width:42px;
  height:60px;
  object-fit:cover;
  border-radius:8px;
}

.search-item-info strong{
  font-size:14px;
  display:block;
  color:#fff;
}

.search-item-info small{
  color:var(--muted);
  font-size:12px;
}

/* ============================================================
   MAIN CONTAINER & GRID
============================================================ */

.container{
  max-width:1450px;
  margin:auto;
  padding:10px 22px 60px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:20px;
}

.movie-card{
  min-width:0;
  cursor:pointer;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  transition:transform .2s,border-color .2s;
}

.movie-card:hover{
  transform:translateY(-4px);
  border-color:#374151;
}

.poster-wrap{
  position:relative;
  aspect-ratio:2/3;
  background:#1a202c;
  overflow:hidden;
}

.poster{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.poster-rating-badge{
  position:absolute;
  top:10px;
  right:10px;
  display:inline-flex;
  align-items:center;
  gap:3px;
  padding:4px 8px;
  border-radius:8px;
  background:rgba(8,10,15,.88);
  border:1px solid rgba(255,255,255,.15);
  color:var(--gold);
  font-size:12px;
  font-weight:800;
  backdrop-filter:blur(6px);
}

.card-body{
  padding:12px;
}

.card-title{
  font-size:13px;
  font-weight:700;
  color:#fff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin:0;
}

/* ============================================================
   DETAILS OVERLAY (SPLIT 2-COLUMN HERO LAYOUT)
============================================================ */

.detail-overlay{
  position:fixed;
  inset:0;
  z-index:5000;
  background:#080a0f;
  overflow-y:auto;
}

.detail-wrapper{
  max-width:1450px;
  margin:0 auto;
  padding:20px 22px 60px;
}

.detail-hero-grid{
  display:grid;
  grid-template-columns:1.8fr 1fr;
  gap:20px;
  margin-bottom:28px;
  align-items:stretch;
}

.detail-banner-wrap{
  width:100%;
  min-height:380px;
  height:100%;
  border-radius:20px;
  overflow:hidden;
  position:relative;
  background:#11151e;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
}

.detail-banner-img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center top;
  display:block;
  transition:opacity 0.6s ease-in-out;
  opacity:1;
}

.detail-banner-gradient{
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(8,10,15,0.1) 0%, rgba(8,10,15,0.95) 100%),
             linear-gradient(90deg, rgba(8,10,15,0.6) 0%, rgba(8,10,15,0.1) 60%);
  z-index:1;
}

.banner-overlay-content{
  position:absolute;
  bottom:20px;
  left:24px;
  right:24px;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:12px;
}

.detail-logo-img{
  max-height:90px;
  max-width:75%;
  object-fit:contain;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,0.85));
}

.detail-title-fallback{
  font-size:30px;
  font-weight:900;
  margin:0;
  color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,0.9);
  line-height:1.15;
}

.detail-meta-row-overlay{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px;
  font-size:13px;
}

.tmdb-rating-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:rgba(8,10,15,0.85);
  border:1px solid rgba(255,255,255,0.2);
  padding:5px 12px;
  border-radius:8px;
  color:var(--gold);
  font-weight:800;
  font-size:13px;
  backdrop-filter:blur(8px);
}

.meta-badge{
  background:rgba(8,10,15,0.85);
  border:1px solid rgba(255,255,255,0.2);
  backdrop-filter:blur(8px);
  padding:5px 12px;
  border-radius:8px;
  color:#f3f4f6;
  font-weight:700;
  font-size:12px;
}

.detail-right-info{
  display:flex;
  flex-direction:column;
  gap:14px;
  justify-content:space-between;
}

.info-card{
  background:rgba(17, 21, 32, 0.85);
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.info-card label{
  display:block;
  font-size:11px;
  font-weight:700;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-bottom:6px;
}

.info-card span{
  font-size:15px;
  font-weight:800;
  color:#fff;
}

.ott-card-logos{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:4px;
}

.ott-card-logo{
  width:34px;
  height:34px;
  border-radius:8px;
  object-fit:cover;
  border:1px solid var(--border);
}

.badge-status{
  display:inline-block;
  padding:3px 8px;
  border-radius:6px;
  font-size:11px;
  font-weight:900;
  margin-left:6px;
}
.status-blockbuster{background:#059669;color:#fff}
.status-hit{background:#10b981;color:#000}
.status-avg{background:#d97706;color:#fff}
.status-flop{background:#dc2626;color:#fff}

.detail-info-body{
  margin-bottom:28px;
}

.detail-overview{
  color:#d1d5db;
  line-height:1.6;
  font-size:14px;
  max-width:1100px;
  margin-bottom:24px;
}

/* ACTION BUTTONS BAR */

.section-actions-bar{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:30px;
}

.action-btn{
  background:var(--panel2);
  border:1px solid var(--border);
  color:#fff;
  padding:12px 24px;
  border-radius:12px;
  font-weight:700;
  font-size:14px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  transition:all .2s;
}

.action-btn:hover{
  background:#262d3e;
  border-color:#4b5563;
}

.action-btn.active{
  background:#2e3444;
  border-color:rgba(255,255,255,0.4);
  color:#fff;
  box-shadow:0 0 12px rgba(255,255,255,0.1);
}

.detail-tab-content{
  margin-bottom:40px;
}

.block-title{
  font-size:20px;
  font-weight:800;
  margin:0 0 18px;
  display:flex;
  align-items:center;
  gap:8px;
}

.cast-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:16px;
}

.cast-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
  text-align:center;
}

.cast-img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:10px;
  background:#1a202c;
  margin-bottom:8px;
}

.cast-name{
  font-size:13px;
  font-weight:800;
  color:#fff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.cast-character{
  font-size:11px;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:2px;
}

.season-select-wrap{
  margin-bottom:20px;
}

.season-select{
  background:#111520;
  border:1px solid var(--border);
  color:#fff;
  padding:10px 16px;
  border-radius:10px;
  font-weight:700;
  outline:none;
}

.episodes-list{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.ep-card{
  display:flex;
  gap:16px;
  background:#111520;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  cursor:pointer;
  transition:transform .2s, border-color .2s;
}

.ep-card:hover{
  transform:translateX(4px);
  border-color:#374151;
}

.ep-still{
  width:160px;
  aspect-ratio:16/9;
  object-fit:cover;
  border-radius:8px;
  background:#1a202c;
  flex-shrink:0;
}

.ep-info{
  flex:1;
}

.ep-title{
  font-size:14px;
  font-weight:800;
  margin:0 0 4px;
}

.ep-meta{
  font-size:11px;
  color:var(--muted);
  margin-bottom:8px;
  display:flex;
  gap:10px;
}

.ep-overview{
  font-size:12px;
  color:#d1d5db;
  line-height:1.4;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.media-tabs{
  display:flex;
  gap:10px;
  border-bottom:1px solid var(--border);
  margin-bottom:16px;
}

.media-tab-btn{
  background:transparent;
  border:0;
  color:var(--muted);
  padding:8px 14px;
  font-weight:800;
  font-size:13px;
  border-bottom:2px solid transparent;
}

.media-tab-btn.active{
  color:#fff;
  border-color:#fff;
}

.media-gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:14px;
}

.media-item{
  aspect-ratio:16/9;
  border-radius:8px;
  object-fit:cover;
  width:100%;
  background:#1a202c;
  border:1px solid var(--border);
  cursor:pointer;
}

.media-item.poster-type{
  aspect-ratio:2/3;
}

.media-item.logo-type{
  aspect-ratio:16/9;
  object-fit:contain;
  padding:10px;
  background:#111520;
}

/* EPISODE OVERLAY */

.episode-overlay{
  position:fixed;
  inset:0;
  z-index:7000;
  background:#080a0f;
  overflow-y:auto;
}

.ep-details-container{
  max-width:1100px;
  margin:0 auto;
  padding:40px 20px;
}

.ep-hero-img{
  width:100%;
  aspect-ratio:16/9;
  max-height:480px;
  object-fit:cover;
  border-radius:18px;
  border:1px solid var(--border);
  margin-bottom:24px;
}

.ep-detail-title{
  font-size:28px;
  font-weight:900;
  margin:0 0 10px;
}

.ep-detail-meta{
  display:flex;
  gap:14px;
  font-size:13px;
  color:var(--muted);
  margin-bottom:16px;
}

.ep-detail-overview{
  font-size:15px;
  line-height:1.6;
  color:#d1d5db;
  margin-bottom:30px;
}

.lightbox{
  position:fixed;
  inset:0;
  z-index:9000;
  background:rgba(0,0,0,.92);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.lightbox img{
  max-width:90%;
  max-height:90vh;
  object-fit:contain;
  border-radius:8px;
}

.loading, .empty{
  padding:40px 15px;
  text-align:center;
  color:var(--muted);
  grid-column:1 / -1;
}

.spinner{
  width:28px;
  height:28px;
  border:3px solid var(--border);
  border-top-color:#fff;
  border-radius:50%;
  margin:0 auto 12px;
  animation:spin .8s linear infinite;
}

@keyframes spin{ to{transform:rotate(360deg)} }

@media(max-width:900px){
  .hero-wrapper{ aspect-ratio:16/10; }
  .hero-title{ font-size:24px; }
  .detail-hero-grid{ grid-template-columns:1fr; }
  .detail-banner-wrap{ min-height:280px; height:280px; }
}

@media(max-width:768px){
  .grid{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .pill-btn span{ display:none; }
  .pill-btn{ padding:10px 14px; }
  .hero-content{ left:16px; right:16px; bottom:20px; }
  .hero-overview{ display:none; }
  .ep-card{ flex-direction:column; }
  .ep-still{ width:100%; }
}
</style>
</head>

<body>

<!-- TOP FLOATING PILL NAVIGATION -->
<div class="top-pill-wrapper">
  <nav class="pill-nav">
    <button type="button" class="pill-btn active" data-tab="home" onclick="setActiveTab('home')">
      <svg class="pill-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </button>
    <button type="button" class="pill-btn" data-tab="movie" onclick="setActiveTab('movie')">
      <svg class="pill-icon" viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H9l2 4H8L6 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>
      <span>Movies</span>
    </button>
    <button type="button" class="pill-btn" data-tab="tv" onclick="setActiveTab('tv')">
      <svg class="pill-icon" viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
      <span>TV Shows</span>
    </button>
    <button type="button" class="pill-btn" data-tab="search" onclick="openSearchModal()">
      <svg class="pill-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <span>Search</span>
    </button>
  </nav>
</div>

<!-- SEARCH MODAL -->
<div id="searchModal" class="search-modal hidden">
  <button class="search-modal-close" onclick="closeSearchModal()">✕</button>
  <div class="search-box-large">
    <span class="search-icon-inside">🔍</span>
    <input id="searchInput" class="search-input-large" type="search" placeholder="Type movie or TV show name..." autocomplete="off">
  </div>
  <div id="searchResultsList" class="search-results-list hidden"></div>
</div>

<main class="container">
  <!-- 16:9 HOME HERO CAROUSEL -->
  <div id="heroSection" class="hero-wrapper" onmouseenter="pauseHeroTimer()" onmouseleave="resumeHeroTimer()">
    <div id="heroSlidesContainer"></div>
    <div id="heroDots" class="hero-dots"></div>
  </div>

  <div id="results" class="grid"></div>
  <div id="scrollSentinel" style="height:40px; margin-top:20px;"></div>
</main>

<!-- DETAILS OVERLAY -->
<div id="detailOverlay" class="detail-overlay hidden">
  <div id="detailBody"></div>
</div>

<!-- DEDICATED EPISODE SUB-PAGE OVERLAY -->
<div id="episodeOverlay" class="episode-overlay hidden">
  <div id="episodeBody"></div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox hidden" onclick="this.classList.add('hidden')">
  <img id="lightboxImg" src="" alt="">
</div>

<script>
/* ============================================================
   CONFIG & STATE
============================================================ */

const API_KEY = "0d516ae53b334d92b86cfc7c958d192f";
const API_BASE = "https://api.themoviedb.org/3";
const IMG_BASE = "https://image.tmdb.org/t/p/";

const state = {
  page: 1,
  totalPages: 1,
  tab: "home",
  isLoading: false,
  results: [],
  currentMedia: { posters: [], backdrops: [], logos: [] },
  currentShowId: null,
  heroItems: [],
  heroIndex: 0
};

let detailBackdropTimer = null;
let heroAutoTimer = null;

/* ============================================================
   HELPERS & FORMATTERS
============================================================ */

async function api(path, params = {}) {
  const url = new URL(API_BASE + path);
  url.searchParams.set("api_key", API_KEY);
  url.searchParams.set("language", "en-US");

  Object.entries(params).forEach(([k, v]) => {
    if (v !== undefined && v !== null && v !== "") url.searchParams.set(k, v);
  });

  const res = await fetch(url);
  if (!res.ok) throw new Error("TMDB fetch error");
  return await res.json();
}

function image(path, size = "w500") {
  return path ? IMG_BASE + size + path : "https://via.placeholder.com/500x750?text=No+Image";
}

function esc(str) {
  return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function formatDate(dateStr) {
  if (!dateStr) return 'N/A';
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
}

function formatRuntime(mins) {
  if (!mins) return 'N/A';
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return `${h}h ${m}m`;
}

function formatINR(usdAmount) {
  if (!usdAmount || usdAmount <= 0) return 'N/A';
  const inrCrores = (usdAmount * 83.5) / 10000000;
  return `₹${inrCrores.toFixed(1)} Cr ($${(usdAmount/1000000).toFixed(1)}M)`;
}

function getBoxOfficeStatus(budget, revenue) {
  if (!budget || !revenue || budget <= 0 || revenue <= 0) return null;
  const ratio = revenue / budget;
  if (ratio >= 2.5) return { text: 'BLOCKBUSTER', class: 'status-blockbuster' };
  if (ratio >= 2.0) return { text: 'HIT', class: 'status-hit' };
  if (ratio >= 1.0) return { text: 'AVERAGE', class: 'status-avg' };
  return { text: 'FLOP', class: 'status-flop' };
}

/* ============================================================
   BROWSER NATIVE NAVIGATION HISTORY API LOGIC
============================================================ */

window.addEventListener('popstate', (e) => {
  if (detailBackdropTimer) clearInterval(detailBackdropTimer);

  const currentState = e.state;

  if (!currentState || currentState.view === 'home') {
    document.getElementById("detailOverlay").classList.add("hidden");
    document.getElementById("episodeOverlay").classList.add("hidden");
    document.body.style.overflow = "";
  } else if (currentState.view === 'details') {
    document.getElementById("detailOverlay").classList.remove("hidden");
    document.getElementById("episodeOverlay").classList.add("hidden");
    document.body.style.overflow = "hidden";
  } else if (currentState.view === 'episode') {
    document.getElementById("episodeOverlay").classList.remove("hidden");
    document.body.style.overflow = "hidden";
  }
});

/* ============================================================
   16:9 HERO SLIDER LOGIC (3 SECONDS CHANGE)
============================================================ */

async function loadHeroSection() {
  try {
    let heroItems = [];
    if (state.tab === "home") {
      const trending = await api("/trending/all/day");
      heroItems = (trending.results || []).filter(i => i.backdrop_path && (i.media_type === 'movie' || i.media_type === 'tv')).slice(0, 5);
    } else if (state.tab === "movie") {
      const trending = await api("/trending/movie/day");
      heroItems = (trending.results || []).filter(i => i.backdrop_path).map(i => ({ ...i, media_type: 'movie' })).slice(0, 5);
    } else if (state.tab === "tv") {
      const trending = await api("/trending/tv/day");
      heroItems = (trending.results || []).filter(i => i.backdrop_path).map(i => ({ ...i, media_type: 'tv' })).slice(0, 5);
    }

    state.heroItems = heroItems;
    state.heroIndex = 0;

    renderHeroSlides();
    startHeroTimer();
  } catch(e) {
    document.getElementById("heroSection").style.display = "none";
  }
}

function renderHeroSlides() {
  const slidesContainer = document.getElementById("heroSlidesContainer");
  const dotsContainer = document.getElementById("heroDots");

  if (!state.heroItems.length) {
    document.getElementById("heroSection").style.display = "none";
    return;
  }

  document.getElementById("heroSection").style.display = "block";

  slidesContainer.innerHTML = state.heroItems.map((item, idx) => {
    const type = item.media_type || (item.first_air_date ? 'tv' : 'movie');
    const title = item.title || item.name;
    const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
    const releaseDate = formatDate(item.release_date || item.first_air_date);

    return `
      <div class="hero-slide ${idx === 0 ? 'active' : ''}" data-index="${idx}">
        <img class="hero-backdrop" src="${image(item.backdrop_path, 'original')}" alt="${esc(title)}">
        <div class="hero-gradient"></div>
        <div class="hero-content">
          <h2 class="hero-title">${esc(title)}</h2>
          <div class="hero-meta-row">
            <span class="tmdb-rating-pill">⭐ ${rating} / 10</span>
            <span class="meta-badge">📅 ${releaseDate}</span>
            <span class="meta-badge">${type === 'tv' ? '📺 TV SHOW' : '🎬 MOVIE'}</span>
          </div>
          <p class="hero-overview">${esc(item.overview)}</p>
          <button class="hero-cta-btn" onclick="openDetails(${item.id}, '${type}')">
            ℹ️ View Details
          </button>
        </div>
      </div>
    `;
  }).join('');

  dotsContainer.innerHTML = state.heroItems.map((_, idx) => `
    <button class="hero-dot ${idx === 0 ? 'active' : ''}" onclick="goToHeroSlide(${idx})"></button>
  `).join('');
}

function startHeroTimer() {
  stopHeroTimer();
  if (state.heroItems.length <= 1) return;

  heroAutoTimer = setInterval(() => {
    state.heroIndex = (state.heroIndex + 1) % state.heroItems.length;
    updateHeroDOM();
  }, 3000); // 3 seconds interval
}

function stopHeroTimer() {
  if (heroAutoTimer) clearInterval(heroAutoTimer);
}

function pauseHeroTimer() {
  stopHeroTimer();
}

function resumeHeroTimer() {
  startHeroTimer();
}

function goToHeroSlide(index) {
  state.heroIndex = index;
  updateHeroDOM();
  startHeroTimer(); // Reset timer on manual dot click
}

function updateHeroDOM() {
  const slides = document.querySelectorAll('.hero-slide');
  const dots = document.querySelectorAll('.hero-dot');

  slides.forEach((s, idx) => {
    s.classList.toggle('active', idx === state.heroIndex);
  });

  dots.forEach((d, idx) => {
    d.classList.toggle('active', idx === state.heroIndex);
  });
}

/* ============================================================
   NAVIGATION & BROWSE
============================================================ */

function setActiveTab(tab) {
  if (state.tab === tab) return;
  state.tab = tab;
  state.page = 1;
  state.results = [];

  document.querySelectorAll('.pill-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });

  loadHeroSection();
  loadBrowse();
}

function openSearchModal() {
  document.getElementById("searchModal").classList.remove("hidden");
  document.getElementById("searchInput").focus();
}

function closeSearchModal() {
  document.getElementById("searchModal").classList.add("hidden");
}

async function loadBrowse(append = false) {
  if (state.isLoading) return;
  state.isLoading = true;

  const container = document.getElementById("results");
  if (!append) container.innerHTML = `<div class="loading"><div class="spinner"></div>Loading...</div>`;

  try {
    let newItems = [];
    if (state.tab === "home") {
      const [m, t] = await Promise.all([
        api("/discover/movie", { page: state.page }),
        api("/discover/tv", { page: state.page })
      ]);
      newItems = [
        ...(m.results || []).map(r=>({...r, media_type:"movie"})), 
        ...(t.results || []).map(r=>({...r, media_type:"tv"}))
      ];
      newItems.sort((a,b) => b.popularity - a.popularity);
      state.totalPages = Math.max(m.total_pages || 1, t.total_pages || 1);
    } else {
      const res = await api(`/discover/${state.tab}`, { page: state.page });
      newItems = (res.results || []).map(r => ({ ...r, media_type: state.tab }));
      state.totalPages = res.total_pages || 1;
    }

    if (!append) state.results = [];
    state.results.push(...newItems);

    renderResults();
  } catch(e) {
    if (!append) container.innerHTML = `<div class="empty">Failed to load titles.</div>`;
  } finally {
    state.isLoading = false;
  }
}

function renderResults() {
  const container = document.getElementById("results");
  if (!state.results.length) {
    container.innerHTML = `<div class="empty">No results found.</div>`;
    return;
  }

  container.innerHTML = state.results.map(item => {
    const type = item.media_type || (item.first_air_date ? "tv" : "movie");
    const title = item.title || item.name;
    const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';

    return `
      <article class="movie-card" onclick="openDetails(${item.id}, '${type}')">
        <div class="poster-wrap">
          <img class="poster" src="${image(item.poster_path)}" alt="" loading="lazy">
          <div class="poster-rating-badge">⭐ ${rating}</div>
        </div>
        <div class="card-body">
          <h3 class="card-title">${esc(title)}</h3>
        </div>
      </article>
    `;
  }).join("");
}

function setupInfiniteScroll() {
  const sentinel = document.getElementById("scrollSentinel");
  const observer = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting && !state.isLoading && state.page < state.totalPages) {
      state.page++;
      loadBrowse(true);
    }
  }, { rootMargin: '300px' });
  observer.observe(sentinel);
}

/* ============================================================
   AUTO SLIDESHOW BACKDROP FOR DETAILS MODAL
============================================================ */

function startDetailBackdropSlideshow(backdropsList, defaultBackdrop) {
  if (detailBackdropTimer) clearInterval(detailBackdropTimer);

  const imgEl = document.getElementById("detailBannerImg");
  if (!imgEl) return;

  const validBackdrops = (backdropsList && backdropsList.length > 0)
    ? backdropsList.slice(0, 10).map(b => image(b.file_path, 'original'))
    : [image(defaultBackdrop, 'original')];

  if (validBackdrops.length <= 1) return;

  let currentIndex = 0;

  detailBackdropTimer = setInterval(() => {
    currentIndex = (currentIndex + 1) % validBackdrops.length;
    imgEl.style.opacity = '0';
    
    setTimeout(() => {
      imgEl.src = validBackdrops[currentIndex];
      imgEl.style.opacity = '1';
    }, 400);
  }, 3000);
}

/* ============================================================
   DETAILS VIEW
============================================================ */

async function openDetails(id, type) {
  closeSearchModal();
  state.currentShowId = id;
  if (detailBackdropTimer) clearInterval(detailBackdropTimer);

  history.pushState({ view: 'details', id, type }, '', `#details-${type}-${id}`);

  const overlay = document.getElementById("detailOverlay");
  const body = document.getElementById("detailBody");
  overlay.classList.remove("hidden");
  document.body.style.overflow = "hidden";

  body.innerHTML = `<div class="loading" style="margin-top:100px"><div class="spinner"></div>Loading details...</div>`;

  try {
    const [data, credits, providers, imagesData] = await Promise.all([
      api(`/${type}/${id}`),
      api(`/${type}/${id}/credits`),
      api(`/${type}/${id}/watch/providers`),
      api(`/${type}/${id}/images`, { include_image_language: 'en,null' })
    ]);

    state.currentMedia = {
      posters: imagesData.posters || [],
      backdrops: imagesData.backdrops || [],
      logos: imagesData.logos || []
    };

    const title = data.title || data.name;
    const releaseDate = formatDate(data.release_date || data.first_air_date);
    const rating = data.vote_average ? data.vote_average.toFixed(1) : 'N/A';
    
    const logoObj = (imagesData.logos || []).find(l => l.iso_639_1 === 'en') || (imagesData.logos || [])[0];
    const logoPath = logoObj ? logoObj.file_path : null;

    let director = 'N/A';
    if (type === 'movie') {
      const dirObj = (credits.crew || []).find(c => c.job === 'Director');
      if (dirObj) director = dirObj.name;
    } else {
      if (data.created_by && data.created_by.length) {
        director = data.created_by.map(c => c.name).join(', ');
      } else {
        const dirObj = (credits.crew || []).find(c => c.job === 'Director');
        if (dirObj) director = dirObj.name;
      }
    }

    const inProviders = providers.results?.IN?.flatrate || providers.results?.IN?.buy || [];

    const ottBoxHTML = `
      <div class="info-card">
        <label>Available On (India)</label>
        ${inProviders.length ? `
          <div class="ott-card-logos">
            ${inProviders.map(p => `<img class="ott-card-logo" src="${IMG_BASE + 'w92' + p.logo_path}" title="${esc(p.provider_name)}">`).join('')}
          </div>
        ` : '<span>Not Available</span>'}
      </div>
    `;

    let rightSideHTML = '';
    if (type === 'movie') {
      const status = getBoxOfficeStatus(data.budget, data.revenue);
      rightSideHTML = `
        <div class="info-card">
          <label>Director</label>
          <span>${esc(director)}</span>
        </div>
        <div class="info-card">
          <label>Runtime</label>
          <span>${formatRuntime(data.runtime)}</span>
        </div>
        <div class="info-card">
          <label>Box Office Revenue</label>
          <span>
            ${formatINR(data.revenue)}
            ${status ? `<span class="badge-status ${status.class}">${status.text}</span>` : ''}
          </span>
        </div>
        ${ottBoxHTML}
      `;
    } else {
      rightSideHTML = `
        <div class="info-card">
          <label>Director / Creator</label>
          <span>${esc(director)}</span>
        </div>
        <div class="info-card">
          <label>Total Seasons & Episodes</label>
          <span>${data.number_of_seasons || 'N/A'} Seasons • ${data.number_of_episodes || 'N/A'} Episodes</span>
        </div>
        ${ottBoxHTML}
      `;
    }

    const castHTML = (credits.cast || []).slice(0, 20).map(c => `
      <div class="cast-card">
        <img class="cast-img" src="${image(c.profile_path, 'w185')}" alt="">
        <div class="cast-name">${esc(c.name)}</div>
        <div class="cast-character">${esc(c.character)}</div>
      </div>
    `).join('');

    body.innerHTML = `
      <div class="detail-wrapper">
        <div class="detail-hero-grid">
          <div class="detail-banner-wrap">
            <img id="detailBannerImg" class="detail-banner-img" src="${image(data.backdrop_path, 'original')}" alt="">
            <div class="detail-banner-gradient"></div>
            
            <div class="banner-overlay-content">
              ${logoPath 
                ? `<img class="detail-logo-img" src="${image(logoPath, 'w500')}" alt="${esc(title)}">` 
                : `<h1 class="detail-title-fallback">${esc(title)}</h1>`
              }
              <div class="detail-meta-row-overlay">
                <div class="tmdb-rating-pill">⭐ ${rating} / 10</div>
                <span class="meta-badge">📅 ${releaseDate}</span>
                <span class="meta-badge">${type === 'tv' ? '📺 TV SHOW' : '🎬 MOVIE'}</span>
              </div>
            </div>
          </div>

          <div class="detail-right-info">
            ${rightSideHTML}
          </div>
        </div>

        <div class="detail-info-body">
          <p class="detail-overview">${esc(data.overview)}</p>
        </div>

        <div class="section-actions-bar">
          <button class="action-btn" onclick="toggleDetailTab('secCast', this)">👥 Cast & Crew</button>
          ${type === 'tv' ? `<button class="action-btn" onclick="toggleDetailTab('secSeasons', this)">📺 Seasons & Episodes</button>` : ''}
          <button class="action-btn" onclick="toggleDetailTab('secMedia', this)">🖼️ Media & Visuals</button>
        </div>

        <section id="secCast" class="detail-tab-content hidden">
          <h2 class="block-title">👥 Top Cast</h2>
          <div class="cast-grid">
            ${castHTML || '<div class="empty">No cast info available.</div>'}
          </div>
        </section>

        ${type === 'tv' ? `
          <section id="secSeasons" class="detail-tab-content hidden">
            <h2 class="block-title">📺 Season & Episode Guide</h2>
            <div class="season-select-wrap">
              <select id="seasonSelect" class="season-select" onchange="loadSeasonEpisodes(${id}, this.value)">
                ${Array.from({length: data.number_of_seasons || 1}, (_, i) => `<option value="${i+1}">Season ${i+1}</option>`).join('')}
              </select>
            </div>
            <div id="episodesList" class="episodes-list"></div>
          </section>
        ` : ''}

        <section id="secMedia" class="detail-tab-content hidden">
          <h2 class="block-title">🖼️ Media & Visuals</h2>
          <div class="media-tabs">
            <button class="media-tab-btn active" onclick="switchMediaTab('backdrops', this)">Backdrops (${state.currentMedia.backdrops.length})</button>
            <button class="media-tab-btn" onclick="switchMediaTab('posters', this)">Posters (${state.currentMedia.posters.length})</button>
            <button class="media-tab-btn" onclick="switchMediaTab('logos', this)">Logos (${state.currentMedia.logos.length})</button>
          </div>
          <div id="mediaGallery" class="media-gallery"></div>
        </section>
      </div>
    `;

    startDetailBackdropSlideshow(imagesData.backdrops, data.backdrop_path);

    if (type === 'tv') loadSeasonEpisodes(id, 1);
    switchMediaTab('backdrops', null);

  } catch(e) {
    body.innerHTML = `<div class="empty" style="margin-top:100px">Failed to load details.</div>`;
  }
}

function toggleDetailTab(targetId, btnEl) {
  const targetSec = document.getElementById(targetId);
  if (!targetSec) return;

  const isAlreadyVisible = !targetSec.classList.contains('hidden');

  document.querySelectorAll('.detail-tab-content').forEach(sec => sec.classList.add('hidden'));
  document.querySelectorAll('.section-actions-bar .action-btn').forEach(b => b.classList.remove('active'));

  if (!isAlreadyVisible) {
    targetSec.classList.remove('hidden');
    btnEl.classList.add('active');
    targetSec.scrollIntoView({ behavior: 'smooth' });
  }
}

/* ============================================================
   TV SEASONS & EPISODES
============================================================ */

async function loadSeasonEpisodes(tvId, seasonNum) {
  const container = document.getElementById("episodesList");
  if (!container) return;
  container.innerHTML = `<div class="loading"><div class="spinner"></div>Loading episodes...</div>`;

  try {
    const data = await api(`/tv/${tvId}/season/${seasonNum}`);
    container.innerHTML = (data.episodes || []).map(ep => `
      <div class="ep-card" onclick="openEpisodeDetails(${tvId}, ${seasonNum}, ${ep.episode_number})">
        <img class="ep-still" src="${image(ep.still_path, 'w300')}" alt="">
        <div class="ep-info">
          <h4 class="ep-title">E${ep.episode_number}. ${esc(ep.name)}</h4>
          <div class="ep-meta">
            <span>📅 ${formatDate(ep.air_date)}</span>
            <span>⭐ ${ep.vote_average ? ep.vote_average.toFixed(1) : 'N/A'}</span>
          </div>
          <div class="ep-overview">${esc(ep.overview || 'No description available.')}</div>
        </div>
      </div>
    `).join('') || `<div class="empty">No episode details found.</div>`;
  } catch(e) {
    container.innerHTML = `<div class="empty">Failed to load season episodes.</div>`;
  }
}

/* ============================================================
   EPISODE SUB-PAGE
============================================================ */

async function openEpisodeDetails(tvId, seasonNum, epNum) {
  history.pushState({ view: 'episode', tvId, seasonNum, epNum }, '', `#ep-S${seasonNum}E${epNum}`);

  const overlay = document.getElementById("episodeOverlay");

  overlay.classList.remove("hidden");

  try {
    const epData = await api(`/tv/${tvId}/season/${seasonNum}/episode/${epNum}`);

      <div class="cast-card">
        <img class="cast-img" src="${image(c.profile_path, 'w185')}" alt="">
        <div class="cast-name">${esc(c.name)}</div>
        <div class="cast-character">${esc(c.character)}</div>
      </div>
    `).join('');

    body.innerHTML = `
      <div class="ep-details-container">
        <img class="ep-hero-img" src="${image(epData.still_path, 'original')}" alt="">
        <h1 class="ep-detail-title">S${seasonNum} E${epNum}. ${esc(epData.name)}</h1>
        <div class="ep-detail-meta">
          <span>📅 Air Date: ${formatDate(epData.air_date)}</span>
          <span>⭐ Rating: ${epData.vote_average ? epData.vote_average.toFixed(1) : 'N/A'} / 10</span>
          <span>⏱️ ${epData.runtime ? epData.runtime + ' mins' : ''}</span>
        </div>
        <p class="ep-detail-overview">${esc(epData.overview || 'No description available.')}</p>

        <section class="section-block" style="padding:0">
          <h2 class="block-title">🎭 Episode Guest Stars</h2>
          <div class="cast-grid">
            ${guestCastHTML || '<div class="empty">No guest stars listed.</div>'}
          </div>
        </section>
      </div>
    `;

  } catch(e) {
    body.innerHTML = `<div class="empty" style="margin-top:100px">Failed to load episode details.</div>`;

}

/* ============================================================
   MEDIA GALLERY & LIGHTBOX
============================================================ */

function switchMediaTab(category, btnEl) {
  if (btnEl) {
    document.querySelectorAll('.media-tab-btn').forEach(b => b.classList.remove('active'));
    btnEl.classList.add('active');
  }

  const gallery = document.getElementById("mediaGallery");
  if (!gallery) return;

  const items = state.currentMedia[category] || [];

  if (!items.length) {
    gallery.innerHTML = `<div class="empty">No ${category} available.</div>`;
    return;
  }

  gallery.innerHTML = items.slice(0, 18).map(m => {
    const imgUrl = image(m.file_path, category === 'logos' ? 'w500' : 'w780');
    const typeClass = category === 'posters' ? 'poster-type' : (category === 'logos' ? 'logo-type' : '');
    return `
      <img class="media-item ${typeClass}" src="${imgUrl}" onclick="openLightbox('${image(m.file_path, 'original')}')" loading="lazy">
    `;
  }).join('');
}

function openLightbox(src) {
  const lb = document.getElementById("lightbox");
  document.getElementById("lightboxImg").src = src;
  lb.classList.remove("hidden");
}

/* ============================================================
   SEARCH INPUT LISTENER
============================================================ */

const searchInput = document.getElementById("searchInput");
const searchResultsList = document.getElementById("searchResultsList");

searchInput.addEventListener("input", async (e) => {
  const q = e.target.value.trim();
  if (q.length < 2) {
    searchResultsList.classList.add("hidden");
    return;
  }

  try {
    const data = await api("/search/multi", { query: q });
    const items = (data.results || []).filter(i => i.media_type === 'movie' || i.media_type === 'tv').slice(0, 10);

    if (!items.length) {
      searchResultsList.classList.add("hidden");
      return;
    }

    searchResultsList.innerHTML = items.map(item => {
      const type = item.media_type;
      const title = item.title || item.name;
      const date = formatDate(item.release_date || item.first_air_date);
      return `
        <div class="search-item" onclick="openDetails(${item.id}, '${type}')">
          <img src="${image(item.poster_path, 'w185')}" alt="">
          <div class="search-item-info">
            <strong>${esc(title)}</strong>
            <small>${type.toUpperCase()} • ${date}</small>
          </div>
        </div>
      `;
    }).join("");

    searchResultsList.classList.remove("hidden");
  } catch(e) {}
});

/* ============================================================
   INIT
============================================================ */

window.addEventListener("DOMContentLoaded", () => {
  history.replaceState({ view: 'home' }, '', ' ');
  loadHeroSection();
  loadBrowse();
  setupInfiniteScroll();
});
</script>
