<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAX Movie App</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- APP HEADER -->
    <header class="main-header">
        <div class="logo">MAX<span>TV</span></div>
    </header>

    <!-- MAIN VIEWS CONTAINER -->
    <main id="app-content">

        <!-- 1. HOME SECTION -->
        <section id="home-view" class="page-view">
            <!-- Hero Banner Slider -->
            <div class="hero-section">
                <div id="hero-slides-container"></div>
                <!-- Black Fade Overlay (z-index: 2) -->
                <div class="hero-overlay"></div>
                <!-- Pagination Dots (z-index: 10 -> Fix for White Dots) -->
                <div id="hero-dots" class="hero-dots"></div>
            </div>

            <!-- Home Content Lists -->
            <div class="content-section">
                <h3>Trending Movies</h3>
                <div id="trending-movies" class="horizontal-scroll"></div>
            </div>

            <div class="content-section">
                <h3>Popular TV Shows</h3>
                <div id="popular-shows" class="horizontal-scroll"></div>
            </div>
        </section>

        <!-- 2. MOVIES SECTION -->
        <section id="movies-view" class="page-view" style="display: none;">
            <h2 class="section-title">Explore Movies</h2>
            <div id="movies-grid" class="poster-grid"></div>
        </section>

        <!-- 3. TV SHOWS SECTION -->
        <section id="tvshows-view" class="page-view" style="display: none;">
            <h2 class="section-title">Explore TV Shows</h2>
            <div id="tvshows-grid" class="poster-grid"></div>
        </section>

        <!-- 4. SEARCH SECTION (Fix for Search Glitch) -->
        <section id="search-view" class="page-view" style="display: none;">
            <div class="search-header-sticky">
                <div class="search-input-wrapper">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="search-input" placeholder="Search for movies, TV shows..." oninput="handleSearchInput(event)">
                    <button class="clear-btn" onclick="clearSearch()"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>
            <div id="search-grid" class="poster-grid search-padding"></div>
        </section>

        <!-- 5. DETAILS SECTION -->
        <section id="details-view" class="page-view" style="display: none;">
            <div id="details-container"></div>
        </section>

        <!-- 6. EPISODE DETAILS SECTION (Fix for Episode Media Loading) -->
        <section id="episode-view" class="page-view" style="display: none;">
            <div id="episode-container"></div>
        </section>

    </main>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="bottom-nav">
        <a href="#home" class="nav-item active"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="#movies" class="nav-item"><i class="fa-solid fa-film"></i><span>Movies</span></a>
        <a href="#tvshows" class="nav-item"><i class="fa-solid fa-tv"></i><span>TV Shows</span></a>
        <a href="#search" class="nav-item"><i class="fa-solid fa-magnifying-glass"></i><span>Search</span></a>
    </nav>

    <script src="app.js"></script>
</body>
</html>
