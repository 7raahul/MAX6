<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVerse</title>
    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --bg-primary: #0b0c10;
            --bg-secondary: #1f2833;
            --bg-card: #2a2f45;
            --text-primary: #ffffff;
            --text-secondary: #c5c6c7;
            --accent: #66fcf1; /* Neon Cyan for a modern sci-fi/cinema vibe */
            --accent-hover: #45a29e;
            --danger: #e50914;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* --- NAVIGATION --- */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            background: rgba(11, 12, 16, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(90deg, var(--accent), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            padding: 0.5rem 0;
            position: relative;
            transition: var(--transition);
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--text-primary);
        }

        .nav-links a.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent);
            border-radius: 2px;
        }

        .btn-pick {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: var(--bg-primary);
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(102, 252, 241, 0.2);
        }

        .btn-pick:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 252, 241, 0.4);
        }

        /* --- MAIN CONTENT GRID --- */
        .main-content {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        /* --- MEDIA CARDS --- */
        .card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .card-img {
            width: 100%;
            height: 300px;
            background: linear-gradient(45deg, #1f2833, #45a29e); /* Placeholder gradient */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: rgba(255,255,255,0.2);
        }

        .card-info {
            padding: 1rem;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        .rating {
            color: #f5c518; /* IMDB Yellow */
            font-weight: bold;
        }

        /* --- SKELETON LOADER --- */
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            gap: 1rem;
            display: none; /* Hidden by default, shown via JS */
        }

        .loader-container.active {
            display: flex;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(102, 252, 241, 0.2);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .navbar {
                flex-wrap: wrap;
                gap: 1rem;
                padding: 1rem;
            }
            .nav-links {
                order: 3;
                width: 100%;
                justify-content: space-around;
            }
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }
            .card-img {
                height: 220px;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="logo">CineVerse</div>
        <div class="nav-links">
            <a href="#all" class="active" data-filter="all">All</a>
            <a href="#movie" data-filter="movie">Movies</a>
            <a href="#tv" data-filter="tv">TV Shows</a>
        </div>
        <button class="btn-pick" id="pickForMeBtn">✨ Pick for me</button>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="grid" id="contentGrid">
            <!-- Cards will be injected here via JavaScript -->
        </div>
        
        <!-- Loading State -->
        <div class="loader-container" id="loader">
            <div class="spinner"></div>
            <p class="loader-text">Loading more content...</p>
        </div>
    </main>

    <script>
        // --- MOCK DATA ---
        const mockData = [
            { id: 1, title: "Neon Horizon", type: "movie", year: 2025, rating: 8.4, emoji: "🌌" },
            { id: 2, title: "The Last Algorithm", type: "tv", year: 2026, rating: 9.1, emoji: "🤖" },
            { id: 3, title: "Echoes of Mars", type: "movie", year: 2024, rating: 7.8, emoji: "🔴" },
            { id: 4, title: "Cyber Detective", type: "tv", year: 2025, rating: 8.9, emoji: "🕵️" },
            { id: 5, title: "Quantum Break", type: "movie", year: 2026, rating: 8.2, emoji: "⏳" },
            { id: 6, title: "Starship Nomads", type: "tv", year: 2023, rating: 7.5, emoji: "🚀" }
        ];

        const grid = document.getElementById('contentGrid');
        const loader = document.getElementById('loader');
        const navLinks = document.querySelectorAll('.nav-links a');
        const pickBtn = document.getElementById('pickForMeBtn');

        // --- RENDER FUNCTIONS ---
        function renderCards(filter = 'all') {
            grid.innerHTML = ''; // Clear existing
            const filtered = filter === 'all' ? mockData : mockData.filter(item => item.type === filter);
            
            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.type = item.type;
                card.innerHTML = `
                    <div class="card-img">${item.emoji}</div>
                    <div class="card-info">
                        <div class="card-title">${item.title}</div>
                        <div class="card-meta">
                            <span>${item.year}</span>
                            <span class="rating">★ ${item.rating}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- NAVIGATION LOGIC ---
        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                navLinks.forEach(l => l.classList.remove('active'));
                link.classList.add('active');
                
                // Simulate loading
                showLoader();
                setTimeout(() => {
                    renderCards(link.dataset.filter);
                    hideLoader();
                }, 800); // Simulate network delay
            });
        });

        // --- PICK FOR ME LOGIC ---
        pickBtn.addEventListener('click', () => {
            const cards = document.querySelectorAll('.card');
            if (cards.length === 0) return;
            
            const randomIndex = Math.floor(Math.random() * cards.length);
            const chosenCard = cards[randomIndex];
            
            // Scroll to and highlight the chosen card
            chosenCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            chosenCard.style.boxShadow = `0 0 30px var(--accent)`;
            chosenCard.style.transform = 'scale(1.05)';
            
            setTimeout(() => {
                chosenCard.style.boxShadow = '';
                chosenCard.style.transform = '';
            }, 2000);
        });

        // --- LOADER HELPERS ---
        function showLoader() {
            loader.classList.add('active');
            grid.style.opacity = '0.3';
        }

        function hideLoader() {
            loader.classList.remove('active');
            grid.style.opacity = '1';
        }

        // --- INITIAL LOAD ---
        renderCards();
    </script>
</body>
</html>
