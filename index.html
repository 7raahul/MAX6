<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineDB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        indigo: { 50:'#FFFFFF',100:'#F5F5F5',200:'#E5E5E5',300:'#D4D4D4',400:'#B0B0B0',500:'#FFFFFF',600:'#9A9A9A',700:'#7A7A7A',800:'#5C5C5C',900:'#404040',950:'#1A1A1A' }
                    },
                    screens: { 'lg': '900px' }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        body { background: #0a0a0a; }
        
        .glass-header {
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-solid {
            background: rgba(20, 20, 25, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .card-solid:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, 0.15); }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, rgba(30, 30, 35, 0.8) 25%, rgba(255, 255, 255, 0.1) 50%, rgba(30, 30, 35, 0.8) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        html {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 999px;
        }
    </style>
</head>
<body class="text-slate-100 font-sans pb-20 lg:pb-0">

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-[100] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Header -->
    <header class="sticky top-0 z-40 glass-header px-4 lg:px-8 py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="goHome()">
                <div class="w-8 h-8 rounded-lg bg-white flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-play text-black text-xs font-black"></i>
                </div>
                <span class="text-xl font-black tracking-tight text-white">CineDB</span>
            </div>

            <!-- Nav Links -->
            <nav class="hidden lg:flex items-center gap-8">
                <button onclick="goHome()" class="text-sm font-semibold text-white hover:text-slate-300 transition">Home</button>
                <button onclick="goMovies()" class="text-sm font-semibold text-slate-400 hover:text-white transition">Movies</button>
                <button onclick="goTVShows()" class="text-sm font-semibold text-slate-400 hover:text-white transition">TV Shows</button>
            </nav>

            <!-- Search + Auth -->
            <div class="flex items-center gap-4">
                <div class="hidden lg:flex relative">
                    <input type="text" id="search-desktop" placeholder="Search..." class="bg-white/10 border border-white/20 rounded-lg px-4 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-white/40 w-48">
                </div>
                <button class="text-sm font-semibold text-slate-400 hover:text-white transition">Sign In</button>
                <button class="text-sm font-bold bg-white text-black px-4 py-2 rounded-lg hover:bg-slate-100 transition">Sign Up</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 lg:px-8 py-6 space-y-8">

        <!-- Hero Section (Auto-slide) -->
        <div id="hero-section" class="relative rounded-2xl overflow-hidden h-96 lg:h-[500px] bg-black group">
            <div id="hero-backdrop" class="absolute inset-0 bg-cover bg-center"></div>
            <div class="absolute inset-0 bg-gradient-to-r from-black via-black/50 to-transparent"></div>

            <!-- Hero Content -->
            <div class="relative h-full flex flex-col justify-end p-6 lg:p-12 space-y-4 max-w-2xl">
                <div class="space-y-2">
                    <h1 id="hero-title" class="text-4xl lg:text-5xl font-black text-white leading-tight">Loading...</h1>
                    <p id="hero-genres" class="text-sm text-slate-400">Loading...</p>
                </div>

                <div class="flex items-center gap-3">
                    <div class="flex items-center gap-1 bg-yellow-500 text-black px-3 py-1 rounded-lg font-bold text-sm">
                        <i class="fa-solid fa-star text-xs"></i>
                        <span id="hero-rating">8.0</span>
                    </div>
                    <span id="hero-year" class="text-slate-400 text-sm">2024</span>
                </div>

                <p id="hero-description" class="text-sm text-slate-300 line-clamp-3 max-w-lg">Loading...</p>

                <div class="flex gap-3 pt-2">
                    <button onclick="showToast('✓ Added to Watched')" class="bg-white text-black px-6 py-2 rounded-lg font-bold text-sm hover:bg-slate-100 transition flex items-center gap-2">
                        <i class="fa-solid fa-check text-xs"></i> Watched
                    </button>
                </div>
            </div>

            <!-- Hero Controls -->
            <button onclick="heroPrev()" class="absolute left-4 top-1/2 -translate-y-1/2 z-20 w-10 h-10 rounded-full bg-black/50 hover:bg-black/75 border border-white/20 flex items-center justify-center text-white opacity-0 group-hover:opacity-100 transition">
                <i class="fa-solid fa-chevron-left text-sm"></i>
            </button>
            <button onclick="heroNext()" class="absolute right-4 top-1/2 -translate-y-1/2 z-20 w-10 h-10 rounded-full bg-black/50 hover:bg-black/75 border border-white/20 flex items-center justify-center text-white opacity-0 group-hover:opacity-100 transition">
                <i class="fa-solid fa-chevron-right text-sm"></i>
            </button>

            <!-- Hero Dots -->
            <div id="hero-dots" class="absolute bottom-4 left-1/2 -translate-x-1/2 z-20 flex gap-2"></div>
        </div>

        <!-- Section: Trending -->
        <div class="space-y-4">
            <h2 class="text-2xl font-black text-white flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-white"></span> Trending Now
            </h2>
            <div id="trending-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                <div class="skeleton aspect-[2/3] rounded-xl"></div>
                <div class="skeleton aspect-[2/3] rounded-xl"></div>
                <div class="skeleton aspect-[2/3] rounded-xl"></div>
                <div class="skeleton aspect-[2/3] rounded-xl"></div>
                <div class="skeleton aspect-[2/3] rounded-xl"></div>
            </div>
        </div>
    </main>

    <!-- Search Modal (Mobile) -->
    <div id="search-modal" class="hidden fixed inset-0 z-50 bg-black/95 backdrop-blur-sm p-4">
        <div class="space-y-4">
            <div class="flex items-center justify-between">
                <input type="text" id="search-mobile" placeholder="Search movies, shows..." class="flex-1 bg-white/10 border border-white/20 rounded-lg px-4 py-2 text-white placeholder-slate-500 focus:outline-none">
                <button onclick="closeSearchModal()" class="ml-2 text-white text-2xl">✕</button>
            </div>
            <div id="search-results" class="grid grid-cols-2 sm:grid-cols-3 gap-4"></div>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="details-modal" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-sm overflow-y-auto">
        <div class="max-w-4xl mx-auto p-4 lg:p-8">
            <button onclick="closeDetails()" class="absolute top-4 right-4 text-white text-3xl hover:text-slate-300">✕</button>
            <div id="details-content" class="space-y-6 mt-8"></div>
        </div>
    </div>

    <!-- Bottom Nav (Mobile) -->
    <nav class="lg:hidden fixed bottom-0 left-0 right-0 z-40 glass-header flex justify-around py-3">
        <button onclick="goHome()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
            <i class="fa-solid fa-home text-lg"></i>
            <span class="text-xs">Home</span>
        </button>
        <button onclick="openSearchModal()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
            <i class="fa-solid fa-magnifying-glass text-lg"></i>
            <span class="text-xs">Search</span>
        </button>
        <button onclick="goMovies()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
            <i class="fa-solid fa-film text-lg"></i>
            <span class="text-xs">Movies</span>
        </button>
        <button onclick="goTVShows()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
            <i class="fa-solid fa-tv text-lg"></i>
            <span class="text-xs">TV Shows</span>
        </button>
    </nav>

    <script>
        const API_KEY = '9c95420163879f1c4726c540b305cbc6';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const BACKDROP_URL = 'https://image.tmdb.org/t/p/w1280';

        let heroItems = [];
        let heroIndex = 0;
        let heroTimer = null;
        let currentCategory = 'all';

        async function fetchTMDB(endpoint, params = '') {
            try {
                const url = `${BASE_URL}${endpoint}?api_key=${API_KEY}${params}`;
                const response = await fetch(url);
                return await response.json();
            } catch (e) {
                console.error(e);
                return null;
            }
        }

        async function loadHeroAndTrending() {
            const endpoint = currentCategory === 'movie' ? '/movie/popular' : currentCategory === 'tv' ? '/tv/popular' : '/trending/all/week';
            const data = await fetchTMDB(endpoint);
            
            if (data?.results) {
                heroItems = data.results.slice(0, 5);
                heroIndex = 0;
                renderHero();
                startHeroAutoSlide();
                loadTrendingGrid(data.results);
            }
        }

        function renderHero() {
            if (!heroItems.length) return;
            const item = heroItems[heroIndex];
            const backdrop = item.backdrop_path ? `${BACKDROP_URL}${item.backdrop_path}` : '#333';
            const title = item.title || item.name || 'Untitled';
            const genres = (item.genre_ids || []).slice(0, 3).map(id => getGenreName(id)).join(' • ') || 'Unknown';
            const year = (item.release_date || item.first_air_date || '').split('-')[0];
            const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
            const description = item.overview || 'No description available.';

            document.getElementById('hero-backdrop').style.backgroundImage = `url('${backdrop}')`;
            document.getElementById('hero-title').textContent = title;
            document.getElementById('hero-genres').textContent = genres;
            document.getElementById('hero-year').textContent = year;
            document.getElementById('hero-rating').textContent = rating;
            document.getElementById('hero-description').textContent = description;

            // Render dots
            const dotsHTML = heroItems.map((_, i) => `
                <div class="w-2 h-2 rounded-full ${i === heroIndex ? 'bg-white' : 'bg-white/40'} cursor-pointer" onclick="heroGoTo(${i})"></div>
            `).join('');
            document.getElementById('hero-dots').innerHTML = dotsHTML;
        }

        function startHeroAutoSlide() {
            if (heroTimer) clearInterval(heroTimer);
            heroTimer = setInterval(() => {
                heroIndex = (heroIndex + 1) % heroItems.length;
                renderHero();
            }, 4000);
        }

        function heroNext() {
            heroIndex = (heroIndex + 1) % heroItems.length;
            renderHero();
            startHeroAutoSlide();
        }

        function heroPrev() {
            heroIndex = (heroIndex - 1 + heroItems.length) % heroItems.length;
            renderHero();
            startHeroAutoSlide();
        }

        function heroGoTo(idx) {
            heroIndex = idx;
            renderHero();
            startHeroAutoSlide();
        }

        async function loadTrendingGrid(items) {
            const html = items.map(item => {
                const type = item.media_type || (item.title ? 'movie' : 'tv');
                const poster = item.poster_path ? `${IMG_URL}${item.poster_path}` : 'https://via.placeholder.com/300x450?text=No+Image';
                const title = item.title || item.name || 'Untitled';
                const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
                return `
                    <div onclick="openDetails('${type}', ${item.id})" class="card-solid rounded-xl overflow-hidden cursor-pointer group">
                        <div class="relative aspect-[2/3] bg-slate-800 overflow-hidden">
                            <img src="${poster}" class="w-full h-full object-cover group-hover:scale-110 transition duration-300" loading="lazy">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition flex items-end p-3">
                                <div class="flex items-center gap-1 bg-yellow-500 text-black px-2 py-1 rounded font-bold text-xs">
                                    <i class="fa-solid fa-star text-[8px]"></i> ${rating}
                                </div>
                            </div>
                        </div>
                        <div class="p-2">
                            <p class="text-xs font-semibold text-white line-clamp-2">${title}</p>
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('trending-grid').innerHTML = html;
        }

        async function openDetails(type, id) {
            const data = await fetchTMDB(`/${type}/${id}`);
            if (!data) return;

            const backdrop = data.backdrop_path ? `${BACKDROP_URL}${data.backdrop_path}` : '#333';
            const poster = data.poster_path ? `${IMG_URL}${data.poster_path}` : 'https://via.placeholder.com/300x450?text=No+Image';
            const title = data.title || data.name || 'Untitled';
            const rating = data.vote_average ? data.vote_average.toFixed(1) : 'N/A';
            const year = (data.release_date || data.first_air_date || '').split('-')[0];
            const description = data.overview || 'No description available.';
            const genres = (data.genres || []).map(g => g.name).join(', ') || 'Unknown';

            const html = `
                <div class="relative rounded-xl overflow-hidden h-64 lg:h-80 bg-cover bg-center mb-6" style="background-image: url('${backdrop}')">
                    <div class="absolute inset-0 bg-gradient-to-t from-black to-transparent"></div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <img src="${poster}" class="rounded-xl h-80 object-cover lg:col-span-1">
                    <div class="lg:col-span-2 space-y-4">
                        <div>
                            <h1 class="text-4xl font-black text-white mb-2">${title}</h1>
                            <div class="flex items-center gap-4 text-sm text-slate-400">
                                <span>${year}</span>
                                <span>${genres}</span>
                                <div class="flex items-center gap-1 bg-yellow-500 text-black px-3 py-1 rounded-lg font-bold">
                                    <i class="fa-solid fa-star text-xs"></i> ${rating}
                                </div>
                            </div>
                        </div>

                        <p class="text-slate-300 leading-relaxed">${description}</p>

                        <button onclick="showToast('✓ Added to Watched'); closeDetails()" class="bg-white text-black px-6 py-2 rounded-lg font-bold hover:bg-slate-100 transition flex items-center gap-2">
                            <i class="fa-solid fa-check text-sm"></i> Watched
                        </button>
                    </div>
                </div>
            `;

            document.getElementById('details-content').innerHTML = html;
            document.getElementById('details-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeDetails() {
            document.getElementById('details-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function openSearchModal() {
            document.getElementById('search-modal').classList.remove('hidden');
            document.getElementById('search-mobile').focus();
        }

        function closeSearchModal() {
            document.getElementById('search-modal').classList.add('hidden');
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'bg-white text-black px-4 py-3 rounded-lg font-semibold text-sm pointer-events-auto';
            toast.textContent = msg;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        function goHome() {
            currentCategory = 'all';
            loadHeroAndTrending();
        }

        function goMovies() {
            currentCategory = 'movie';
            loadHeroAndTrending();
        }

        function goTVShows() {
            currentCategory = 'tv';
            loadHeroAndTrending();
        }

        function getGenreName(id) {
            const genres = { 28: 'Action', 12: 'Adventure', 16: 'Animation', 35: 'Comedy', 80: 'Crime', 99: 'Documentary', 18: 'Drama', 10751: 'Family', 14: 'Fantasy', 36: 'History', 27: 'Horror', 10402: 'Music', 9648: 'Mystery', 10749: 'Romance', 878: 'Sci-Fi', 10770: 'TV Movie', 53: 'Thriller', 10752: 'War', 37: 'Western' };
            return genres[id] || 'Genre';
        }

        // Init
        loadHeroAndTrending();
    </script>
</body>
</html>
