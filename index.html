<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CINEVO</title>
    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-card: #141414;
            --accent: #ccff00;
            --yellow: #ffd700;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-primary); color: var(--text-primary); overflow-x: hidden; padding-bottom: 90px; }

        /* Top Header - Fixed Overlap */
        .top-header { 
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 100%); 
            padding: 1rem; display: flex; justify-content: space-between; align-items: center; 
        }
        .logo { font-size: 1.8rem; font-weight: 900; color: var(--yellow); letter-spacing: -1px; text-decoration: none; }
        .profile-icon { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--text-primary); display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); }

        /* Top Nav */
        .top-nav { 
            position: fixed; top: 65px; left: 0; right: 0; z-index: 999; 
            background: rgba(0,0,0,0.9); backdrop-filter: blur(5px);
            display: flex; justify-content: space-around; padding: 0.8rem 0; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
        }
        .top-nav a { color: var(--text-secondary); text-decoration: none; font-size: 0.95rem; font-weight: 600; position: relative; transition: var(--transition); }
        .top-nav a.active { color: var(--accent); }
        .top-nav a.active::after { content: ''; position: absolute; bottom: -12px; left: 20%; right: 20%; height: 3px; background: var(--accent); border-radius: 2px; }

        /* Hero Banner - Fixed Positioning */
        .hero-banner { 
            position: relative; width: 100%; height: 500px; 
            overflow: hidden; background: var(--bg-card); 
        }
        .hero-backdrop { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.8s ease-in-out; }
        .hero-overlay { 
            position: absolute; bottom: 0; left: 0; right: 0; 
            background: linear-gradient(to top, var(--bg-primary) 0%, rgba(0,0,0,0.8) 40%, transparent 100%); 
            padding: 5rem 1.5rem 1.5rem; /* Extra top padding to clear nav */
            display: flex; flex-direction: column; align-items: flex-start; 
        }
        .hero-logo { max-width: 250px; max-height: 100px; object-fit: contain; margin-bottom: 1rem; filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.8)); }
        .hero-title-fallback { font-size: 2rem; font-weight: 900; margin-bottom: 0.5rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); display: none; }
        .hero-meta { display: flex; gap: 1rem; color: var(--text-secondary); font-size: 0.9rem; }

        /* Main Grid (Infinite Scroll) */
        .main-content { padding: 1.5rem 1rem; }
        .content-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .content-card { cursor: pointer; transition: var(--transition); position: relative; }
        .content-card:active { transform: scale(0.95); }
        .content-card img { width: 100%; height: 220px; object-fit: cover; border-radius: 10px; background: var(--bg-card); }
        .content-card .card-title { margin-top: 0.5rem; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-secondary); }

        /* Bottom Navigation - Fixed Overlap */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: rgba(10,10,10,0.98); backdrop-filter: blur(10px); 
            border-top: 1px solid rgba(255,255,255,0.1); 
            display: flex; justify-content: space-around; padding: 0.6rem 0; z-index: 1000; 
        }
        .bottom-nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px 0; cursor: pointer; color: var(--text-secondary); transition: var(--transition); }
        .bottom-nav-item.active { color: var(--accent); }
        .bottom-nav-item svg { width: 22px; height: 22px; fill: currentColor; flex-shrink: 0; }
        .bottom-nav-item span { font-size: 11px; font-weight: 600; white-space: nowrap; text-align: center; line-height: 1.2; }

        /* Loader */
        .loader { text-align: center; padding: 2rem; color: var(--text-secondary); display: none; width: 100%; grid-column: 1 / -1; }
        .loader.active { display: block; }
        .spinner { width: 30px; height: 30px; border: 3px solid var(--bg-card); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Search Modal */
        .search-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-primary); z-index: 2000; display: none; flex-direction: column; padding: 1rem; }
        .search-modal.active { display: flex; }
        .search-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
        .search-input { flex: 1; background: var(--bg-card); border: 1px solid rgba(255,255,255,0.1); padding: 0.8rem 1rem; border-radius: 8px; color: var(--text-primary); font-size: 1rem; outline: none; }
        .search-input:focus { border-color: var(--accent); }
        .search-close { background: none; border: none; color: var(--text-primary); font-size: 1.5rem; cursor: pointer; }
        .search-results { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; align-content: start; }

        /* Detail Modal */
        .detail-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-primary); z-index: 3000; display: none; overflow-y: auto; }
        .detail-modal.active { display: block; }
        .detail-backdrop { width: 100%; height: 350px; object-fit: cover; mask-image: linear-gradient(to bottom, black 40%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 100%); }
        .detail-content { padding: 1rem; margin-top: -80px; position: relative; z-index: 1; }
        .detail-logo { max-width: 200px; max-height: 80px; object-fit: contain; margin-bottom: 1rem; filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.8)); }
        .detail-title-fallback { font-size: 1.8rem; font-weight: 700; margin-bottom: 1rem; display: none; }
        .detail-meta { display: flex; gap: 1rem; margin-bottom: 1rem; color: var(--text-secondary); font-size: 0.9rem; flex-wrap: wrap; }
        .detail-rating { color: var(--accent); font-weight: 700; }
        .detail-overview { line-height: 1.6; margin-bottom: 1.5rem; color: var(--text-secondary); font-size: 0.95rem; }
        .detail-section { margin-bottom: 1.5rem; }
        .detail-section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.8rem; color: var(--accent); }
        
        .cast-list, .provider-list { display: flex; gap: 1rem; overflow-x: auto; scrollbar-width: none; padding-bottom: 0.5rem; }
        .cast-list::-webkit-scrollbar, .provider-list::-webkit-scrollbar { display: none; }
        .cast-item { flex: 0 0 80px; text-align: center; }
        .cast-item img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 0.3rem; background: var(--bg-card); }
        .cast-name { font-size: 0.75rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .provider-item { flex: 0 0 auto; background: var(--bg-card); padding: 0.5rem; border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
        .provider-item img { width: 40px; height: 40px; object-fit: contain; border-radius: 4px; }
        .provider-item span { font-size: 0.7rem; color: var(--text-secondary); max-width: 60px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .season-selector { width: 100%; background: var(--bg-card); color: white; border: 1px solid rgba(255,255,255,0.1); padding: 0.8rem; border-radius: 8px; font-size: 1rem; margin-bottom: 1rem; outline: none; }
        .episode-item { display: flex; gap: 1rem; background: var(--bg-card); padding: 0.8rem; border-radius: 8px; margin-bottom: 0.8rem; }
        .episode-thumb { width: 120px; height: 70px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--bg-secondary); }
        .episode-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .episode-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.2rem; }
        .episode-date { font-size: 0.8rem; color: var(--text-secondary); }

        .close-detail { position: fixed; top: 1rem; right: 1rem; background: rgba(0,0,0,0.7); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; font-size: 1.5rem; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; }

        /* Timeline View */
        .timeline-view { display: none; padding: 1.5rem 1rem; padding-bottom: 100px; }
        .timeline-view.active { display: block; }
        .timeline-item { display: flex; gap: 1rem; background: var(--bg-card); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; cursor: pointer; }
        .timeline-thumb { width: 100px; height: 60px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
        .timeline-info { flex: 1; }
        .timeline-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 0.3rem; }
        .timeline-date { font-size: 0.8rem; color: var(--text-secondary); }

        @media (min-width: 768px) {
            .content-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1.5rem; }
            .content-card img { height: 240px; }
            .hero-banner { height: 600px; }
            .hero-logo { max-width: 350px; max-height: 120px; }
        }
    </style>
</head>
<body>

    <header class="top-header">
        <a href="#" class="logo" onclick="resetApp()">CINEVO</a>
        <div class="profile-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
    </header>

    <nav class="top-nav">
        <a href="#" class="active" data-tab="all" onclick="switchTab('all')">Home</a>
        <a href="#" data-tab="tv" onclick="switchTab('tv')">TV Shows</a>
        <a href="#" data-tab="movie" onclick="switchTab('movie')">Movies</a>
    </nav>

    <div class="hero-banner" id="heroBanner">
        <img class="hero-backdrop" id="heroBackdrop" src="" alt="">
        <div class="hero-overlay">
            <img class="hero-logo" id="heroLogo" src="" alt="" style="display:none;">
            <h1 class="hero-title-fallback" id="heroTitle"></h1>
            <div class="hero-meta">
                <span id="heroYear"></span>
                <span id="heroRating"></span>
            </div>
        </div>
    </div>

    <main class="main-content" id="mainContent">
        <div class="content-grid" id="contentGrid"></div>
        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>Loading more content...</p>
        </div>
    </main>

    <div class="timeline-view" id="timelineView">
        <h2 style="margin-bottom:1rem; font-size:1.3rem;">Watch Timeline</h2>
        <div id="timelineList"></div>
    </div>

    <nav class="bottom-nav">
        <div class="bottom-nav-item active" onclick="switchBottomNav('home', this)">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </div>
        <div class="bottom-nav-item" onclick="openSearch()">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <span>Search</span>
        </div>
        <div class="bottom-nav-item" onclick="pickForMe()">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7.5 17c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm0-9C6.67 8 6 7.33 6 6.5S6.67 5 7.5 5 9 5.67 9 6.5 8.33 8 7.5 8zm4.5 4.5h5v1h-5v-1zm0-4h5v1h-5V8.5z"/></svg>
            <span>Pick for Me</span>
        </div>
        <div class="bottom-nav-item" onclick="switchBottomNav('timeline', this)">
            <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
            <span>Timeline</span>
        </div>
    </nav>

    <div class="search-modal" id="searchModal">
        <div class="search-header">
            <button class="search-close" onclick="closeSearch()">×</button>
            <input type="text" class="search-input" id="searchInput" placeholder="Search movies, TV shows...">
        </div>
        <div class="search-results" id="searchResults"></div>
    </div>

    <div class="detail-modal" id="detailModal">
        <button class="close-detail" onclick="closeDetail()">×</button>
        <img class="detail-backdrop" id="detailBackdrop" src="" alt="">
        <div class="detail-content">
            <img class="detail-logo" id="detailLogo" src="" style="display:none;">
            <h1 class="detail-title-fallback" id="detailTitle"></h1>
            <div class="detail-meta" id="detailMeta"></div>
            <p class="detail-overview" id="detailOverview"></p>
            
            <div class="detail-section" id="providersSection">
                <h3 class="detail-section-title">Available On (India)</h3>
                <div class="provider-list" id="providerList"></div>
            </div>
            
            <div class="detail-section" id="castSection">
                <h3 class="detail-section-title">Cast</h3>
                <div class="cast-list" id="castList"></div>
            </div>

            <div class="detail-section" id="episodesSection" style="display:none;">
                <h3 class="detail-section-title">Episodes</h3>
                <select class="season-selector" id="seasonSelector" onchange="loadEpisodes()"></select>
                <div id="episodesList"></div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = '9c95420163879f1c4726c540b305cbc6';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p';
        const REGION = 'IN';

        let currentTab = 'all';
        let currentPage = 1;
        let isLoading = false;
        let heroItems = [];
        let currentHeroIndex = 0;
        let heroInterval;
        let currentDetail = null;

        document.addEventListener('DOMContentLoaded', () => {
            initApp();
            window.addEventListener('scroll', handleInfiniteScroll);
        });

        async function fetchTMDB(endpoint, params = '') {
            try {
                const res = await fetch(`${BASE_URL}${endpoint}?api_key=${API_KEY}${params}`);
                return await res.json();
            } catch (e) { return null; }
        }

        async function initApp() {
            await loadHeroItems();
            startHeroRotation();
            loadContent();
        }

        async function loadHeroItems() {
            const data = await fetchTMDB('/trending/all/week');
            if (data && data.results) {
                const top5 = data.results.slice(0, 5);
                for (let item of top5) {
                    const details = await fetchTMDB(`/${item.media_type}/${item.id}`, '&append_to_response=images');
                    if (details) {
                        details._mediaType = item.media_type;
                        heroItems.push(details);
                    }
                }
                if (heroItems.length > 0) renderHero(heroItems[0]);
            }
        }

        function renderHero(item) {
            const backdrop = item.backdrop_path ? `${IMG_URL}/w1280${item.backdrop_path}` : '';
            document.getElementById('heroBackdrop').src = backdrop;
            
            const title = item.title || item.name;
            const year = (item.release_date || item.first_air_date || '').split('-')[0] || 'N/A';
            const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
            
            document.getElementById('heroYear').textContent = year;
            document.getElementById('heroRating').textContent = `★ ${rating}`;

            const logos = item.images?.logos || [];
            const enLogo = logos.find(l => l.iso_639_1 === 'en') || logos[0];
            
            const logoImg = document.getElementById('heroLogo');
            const titleText = document.getElementById('heroTitle');
            
            if (enLogo) {
                logoImg.src = `${IMG_URL}/w500${enLogo.file_path}`;
                logoImg.style.display = 'block';
                titleText.style.display = 'none';
            } else {
                logoImg.style.display = 'none';
                titleText.textContent = title;
                titleText.style.display = 'block';
            }

            document.getElementById('heroBanner').onclick = () => openDetail(item.id, item._mediaType);
        }

        function startHeroRotation() {
            if (heroInterval) clearInterval(heroInterval);
            heroInterval = setInterval(() => {
                if (heroItems.length === 0) return;
                currentHeroIndex = (currentHeroIndex + 1) % heroItems.length;
                renderHero(heroItems[currentHeroIndex]);
            }, 3500);
        }

        async function loadContent(reset = false) {
            if (isLoading) return;
            isLoading = true;
            document.getElementById('loader').classList.add('active');

            if (reset) {
                currentPage = 1;
                document.getElementById('contentGrid').innerHTML = '';
            }

            let endpoint = currentTab === 'movie' ? '/trending/movie/week' : currentTab === 'tv' ? '/trending/tv/week' : '/trending/all/week';
            const data = await fetchTMDB(endpoint, `&page=${currentPage}`);

            if (data && data.results) {
                const grid = document.getElementById('contentGrid');
                data.results.forEach(item => {
                    if (item.media_type === 'person') return;
                    const title = item.title || item.name;
                    const poster = item.poster_path ? `${IMG_URL}/w500${item.poster_path}` : `https://via.placeholder.com/130x200/141414/ccff00?text=${encodeURIComponent(title)}`;
                    
                    const card = document.createElement('div');
                    card.className = 'content-card';
                    card.onclick = () => openDetail(item.id, item.media_type || currentTab);
                    card.innerHTML = `
                        <img src="${poster}" alt="${title}" loading="lazy">
                        <div class="card-title">${title}</div>
                    `;
                    grid.appendChild(card);
                });
                currentPage++;
            }

            isLoading = false;
            document.getElementById('loader').classList.remove('active');
        }

        function handleInfiniteScroll() {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 300) {
                if (!isLoading && document.getElementById('mainContent').style.display !== 'none') {
                    loadContent();
                }
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.top-nav a').forEach(a => a.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
            loadContent(true);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function switchBottomNav(view, el) {
            document.querySelectorAll('.bottom-nav-item').forEach(item => item.classList.remove('active'));
            el.classList.add('active');

            if (view === 'home') {
                document.getElementById('mainContent').style.display = 'block';
                document.getElementById('timelineView').classList.remove('active');
                document.querySelector('.hero-banner').style.display = 'block';
                document.querySelector('.top-nav').style.display = 'flex';
            } else if (view === 'timeline') {
                document.getElementById('mainContent').style.display = 'none';
                document.getElementById('timelineView').classList.add('active');
                document.querySelector('.hero-banner').style.display = 'none';
                document.querySelector('.top-nav').style.display = 'none';
                renderTimeline();
            }
        }

        function resetApp() {
            switchTab('all');
            document.querySelectorAll('.bottom-nav-item').forEach(item => item.classList.remove('active'));
            document.querySelector('.bottom-nav-item').classList.add('active');
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('timelineView').classList.remove('active');
            document.querySelector('.hero-banner').style.display = 'block';
            document.querySelector('.top-nav').style.display = 'flex';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openSearch() { document.getElementById('searchModal').classList.add('active'); document.getElementById('searchInput').focus(); }
        function closeSearch() { document.getElementById('searchModal').classList.remove('active'); document.getElementById('searchInput').value = ''; document.getElementById('searchResults').innerHTML = ''; }
        
        document.getElementById('searchInput').addEventListener('input', async (e) => {
            const query = e.target.value.trim();
            if (query.length < 2) { document.getElementById('searchResults').innerHTML = ''; return; }
            const data = await fetchTMDB('/search/multi', `&query=${encodeURIComponent(query)}`);
            if (data && data.results) {
                const container = document.getElementById('searchResults');
                container.innerHTML = '';
                data.results.filter(i => i.media_type !== 'person').forEach(item => {
                    const title = item.title || item.name;
                    const poster = item.poster_path ? `${IMG_URL}/w500${item.poster_path}` : `https://via.placeholder.com/120x180/141414/ccff00?text=${encodeURIComponent(title)}`;
                    const div = document.createElement('div');
                    div.className = 'content-card';
                    div.onclick = () => { closeSearch(); openDetail(item.id, item.media_type); };
                    div.innerHTML = `<img src="${poster}" alt="${title}"><div class="card-title">${title}</div>`;
                    container.appendChild(div);
                });
            }
        });

        async function openDetail(id, type) {
            currentDetail = { id, type };
            document.getElementById('detailModal').classList.add('active');
            document.body.style.overflow = 'hidden';

            const data = await fetchTMDB(`/${type}/${id}`, '&append_to_response=credits,watch/providers,images');
            if (!data) return;

            const backdrop = data.backdrop_path ? `${IMG_URL}/w1280${data.backdrop_path}` : '';
            document.getElementById('detailBackdrop').src = backdrop;

            const title = data.title || data.name;
            const logos = data.images?.logos || [];
            const enLogo = logos.find(l => l.iso_639_1 === 'en') || logos[0];
            const logoImg = document.getElementById('detailLogo');
            const titleText = document.getElementById('detailTitle');

            if (enLogo) {
                logoImg.src = `${IMG_URL}/w500${enLogo.file_path}`;
                logoImg.style.display = 'block';
                titleText.style.display = 'none';
            } else {
                logoImg.style.display = 'none';
                titleText.textContent = title;
                titleText.style.display = 'block';
            }

            const year = (data.release_date || data.first_air_date || '').split('-')[0] || 'N/A';
            const rating = data.vote_average ? data.vote_average.toFixed(1) : 'N/A';
            const runtime = type === 'movie' && data.runtime ? `${data.runtime} min` : (data.number_of_seasons ? `${data.number_of_seasons} Seasons` : '');
            document.getElementById('detailMeta').innerHTML = `<span>${year}</span><span class="detail-rating">★ ${rating}</span><span>${runtime}</span>`;
            document.getElementById('detailOverview').textContent = data.overview || 'No overview available.';

            const providers = data['watch/providers']?.results?.[REGION];
            const pList = document.getElementById('providerList');
            pList.innerHTML = '';
            if (providers?.flatrate) {
                providers.flatrate.forEach(p => {
                    pList.innerHTML += `<div class="provider-item"><img src="${IMG_URL}/w200${p.logo_path}" alt="${p.provider_name}"><span>${p.provider_name}</span></div>`;
                });
            } else {
                pList.innerHTML = '<p style="color:var(--text-secondary);width:100%;text-align:center;font-size:0.9rem;">Not available on tracked platforms in India</p>';
            }

            const cList = document.getElementById('castList');
            cList.innerHTML = '';
            if (data.credits?.cast) {
                data.credits.cast.slice(0, 10).forEach(p => {
                    const img = p.profile_path ? `${IMG_URL}/w185${p.profile_path}` : 'https://via.placeholder.com/80x80/141414/ccff00?text=?';
                    cList.innerHTML += `<div class="cast-item"><img src="${img}" alt="${p.name}"><div class="cast-name">${p.name}</div></div>`;
                });
            }

            if (type === 'tv') {
                document.getElementById('episodesSection').style.display = 'block';
                const sel = document.getElementById('seasonSelector');
                sel.innerHTML = '';
                data.seasons?.filter(s => s.season_number > 0).forEach(s => {
                    sel.innerHTML += `<option value="${s.season_number}">Season ${s.season_number} (${s.episode_count} eps)</option>`;
                });
                loadEpisodes();
            } else {
                document.getElementById('episodesSection').style.display = 'none';
            }

            saveToHistory(data);
        }

        async function loadEpisodes() {
            const sNum = document.getElementById('seasonSelector').value;
            const list = document.getElementById('episodesList');
            list.innerHTML = '<p style="color:var(--text-secondary);">Loading...</p>';
            const data = await fetchTMDB(`/tv/${currentDetail.id}/season/${sNum}`);
            if (!data?.episodes) return;
            list.innerHTML = '';
            data.episodes.forEach(ep => {
                const img = ep.still_path ? `${IMG_URL}/w300${ep.still_path}` : 'https://via.placeholder.com/120x70/141414/ccff00?text=No+Image';
                list.innerHTML += `
                    <div class="episode-item">
                        <img class="episode-thumb" src="${img}" alt="">
                        <div class="episode-info">
                            <div class="episode-title">E${ep.episode_number}: ${ep.name}</div>
                            <div class="episode-date">${ep.air_date || 'TBA'}</div>
                        </div>
                    </div>`;
            });
        }

        function closeDetail() { document.getElementById('detailModal').classList.remove('active'); document.body.style.overflow = ''; }

        function pickForMe() {
            if (heroItems.length === 0) return;
            const random = heroItems[Math.floor(Math.random() * heroItems.length)];
            openDetail(random.id, random._mediaType);
        }

        function saveToHistory(item) {
            let history = JSON.parse(localStorage.getItem('cinevo_history') || '[]');
            history = history.filter(i => i.id !== item.id);
            history.unshift({ id: item.id, type: item.title ? 'movie' : 'tv', title: item.title || item.name, poster: item.poster_path, date: new Date().toLocaleDateString() });
            localStorage.setItem('cinevo_history', JSON.stringify(history.slice(0, 20)));
        }

        function renderTimeline() {
            const history = JSON.parse(localStorage.getItem('cinevo_history') || '[]');
            const container = document.getElementById('timelineList');
            if (history.length === 0) { container.innerHTML = '<p style="color:var(--text-secondary);text-align:center;padding:2rem;">No watch history yet.</p>'; return; }
            container.innerHTML = '';
            history.forEach(item => {
                const img = item.poster ? `${IMG_URL}/w200${item.poster}` : 'https://via.placeholder.com/100x60/141414/ccff00?text=?';
                container.innerHTML += `
                    <div class="timeline-item" onclick="openDetail(${item.id}, '${item.type}')">
                        <img class="timeline-thumb" src="${img}" alt="">
                        <div class="timeline-info">
                            <div class="timeline-title">${item.title}</div>
                            <div class="timeline-date">${item.date}</div>
                        </div>
                    </div>`;
            });
        }
    </script>
</body>
</html>
