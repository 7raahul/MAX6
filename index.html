<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinemo — Movie & TV Tracker</title>

<style>
:root{
  --bg:#090b10;
  --panel:#11141b;
  --panel2:#171b24;
  --card:#141820;
  --border:#252b36;
  --text:#f4f6f8;
  --muted:#9299a6;
  --accent:#e5e7eb;
  --gold:#f5c518;
  --brand:#14e8c4;
  --shadow:0 14px 40px rgba(0,0,0,.35);
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 20% 0%,rgba(255,255,255,.035),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding-bottom:20px;
}

button,
select,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

.hidden{
  display:none!important;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(9,11,16,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.nav{
  max-width:1450px;
  margin:auto;
  min-height:70px;
  padding:12px 22px;
  display:flex;
  align-items:center;
  gap:18px;
}

.logo{
  font-size:21px;
  font-weight:800;
  letter-spacing:-.5px;
  white-space:nowrap;
  cursor:pointer;
}

.logo span{
  color:#9ca3af;
}

.search-wrap{
  flex:1;
  max-width:430px;
  position:relative;
}

.search{
  width:100%;
  background:#151922;
  border:1px solid var(--border);
  border-radius:12px;
  color:white;
  outline:none;
  padding:9px 13px 9px 36px;
  height:40px;
  font-size:13px;
}

.search:focus{
  border-color:#4b5563;
}

.search-icon{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
}

.search-suggestions{
  position:absolute;
  left:0;
  right:0;
  top:calc(100% + 7px);
  z-index:5000;
  background:#12161d;
  border:1px solid #303641;
  border-radius:12px;
  box-shadow:0 22px 50px rgba(0,0,0,.55);
  overflow:hidden;
  max-height:390px;
  overflow-y:auto;
}

.search-suggestion{
  display:flex;
  gap:10px;
  align-items:center;
  padding:8px 10px;
  border:0;
  background:transparent;
  color:#fff;
  width:100%;
  text-align:left;
  cursor:pointer;
}

.search-suggestion:hover{
  background:#1d232d;
}

.search-suggestion img{
  width:34px;
  height:50px;
  object-fit:cover;
  border-radius:5px;
  flex:0 0 34px;
}

.search-suggestion strong{
  font-size:12px;
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.search-suggestion small{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

.global-media-filter{
  max-width:1450px;
  margin:0 auto;
  padding:18px 22px 0;
  display:flex;
  align-items:center;
  gap:6px;
}

.global-media-btn{
  appearance:none;
  border:1px solid var(--border);
  background:#131720;
  color:#aeb5c0;
  padding:8px 16px;
  border-radius:10px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.05em;
  cursor:pointer;
  transition:all .2s ease;
}

.global-media-btn:hover{
  background:#1b202a;
  color:#fff;
}

.global-media-btn.active{
  background:var(--brand);
  border-color:var(--brand);
  color:#04140f;
}

/* MAIN CONTAINER */

.container{
  max-width:1450px;
  margin:auto;
  padding:20px 22px 80px;
}

.section{
  margin-bottom:34px;
}

.section-title{
  font-size:21px;
  margin:0;
  font-weight:800;
  letter-spacing:-.3px;
}

.section-subtitle{
  color:var(--muted);
  margin:5px 0 17px;
  font-size:14px;
}

/* TRENDING HERO */

.trending{
  position:relative;
  overflow:hidden;
  min-height:390px;
  border-radius:22px;
  border:1px solid var(--border);
  background:#10131a;
  box-shadow:var(--shadow);
}

.trend-slide{
  position:absolute;
  inset:0;
  opacity:0;
  pointer-events:none;
  transition:opacity .55s ease;
}

.trend-slide.active{
  opacity:1;
  pointer-events:auto;
}

.trend-bg{
  position:absolute;
  z-index:1;
  top:0;
  right:0;
  width:55%;
  height:100%;
  object-fit:cover;
  object-position:center;
}

.trend-overlay{
  position:absolute;
  z-index:2;
  inset:0;
  width:55%;
  background:linear-gradient(90deg,#10131a 0%,rgba(16,19,26,.98) 75%,rgba(16,19,26,.75) 100%);
}

.trend-content{
  position:relative;
  z-index:3;
  min-height:390px;
  width:50%;
  padding:42px 40px;
  display:flex;
  justify-content:center;
  flex-direction:column;
}

.trend-type{
  color:#b5bbc5;
  text-transform:uppercase;
  font-size:11px;
  font-weight:800;
  letter-spacing:1.2px;
  margin-bottom:10px;
}

.trend-rating-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:38px;
  height:38px;
  border-radius:50%;
  border:2px solid var(--gold);
  background:rgba(10,12,17,.88);
  color:var(--gold);
  font-weight:900;
  font-size:12px;
  margin-bottom:12px;
}

.trend-title{
  font-size:36px;
  line-height:1.05;
  margin:0 0 12px;
  letter-spacing:-1px;
}

.trend-overview{
  color:#d1d5db;
  line-height:1.5;
  font-size:13px;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.trend-btn{
  width:max-content;
  margin-top:16px;
  padding:10px 18px;
  border:0;
  border-radius:10px;
  background:#fff;
  color:#080a0f;
  font-weight:800;
  font-size:12px;
}

.trend-arrow{
  position:absolute;
  z-index:5;
  bottom:15px;
  width:36px;
  height:36px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(0,0,0,.5);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.trend-prev{right:58px;}
.trend-next{right:15px;}

/* BROWSE GRID & CARDS */

.results-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
  gap:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:17px;
}

.movie-card{
  min-width:0;
  cursor:pointer;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  overflow:hidden;
  transition:transform .2s,border-color .2s,box-shadow .2s;
}

.movie-card:hover{
  transform:translateY(-3px);
  border-color:#3a414d;
  box-shadow:0 15px 35px rgba(0,0,0,.25);
}

.poster-wrap{
  position:relative;
  aspect-ratio:2/3;
  background:#1b2029;
  overflow:hidden;
}

.poster{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.poster-type{
  position:absolute;
  top:9px;
  left:9px;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(5px);
  padding:4px 7px;
  border-radius:6px;
  font-size:9px;
  font-weight:800;
  text-transform:uppercase;
}

.poster-rating-badge{
  position:absolute;
  z-index:4;
  top:9px;
  right:9px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  border-radius:50%;
  border:2px solid var(--gold);
  background:rgba(10,12,17,.88);
  color:var(--gold);
  backdrop-filter:blur(3px);
}

.poster-rating-badge span{
  font-size:11px;
  font-weight:900;
  line-height:1;
}

.poster-rating-badge small{
  font-size:7px;
  font-weight:900;
  margin-left:1px;
  margin-top:2px;
}

.card-body{
  padding:11px;
}

.card-title{
  font-size:13px;
  font-weight:750;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.card-actions{
  display:flex;
  gap:6px;
  margin-top:10px;
}

.details-btn{
  flex:1;
  background:#e9ebee;
  color:#080a0e;
  border:0;
  border-radius:8px;
  padding:7px 8px;
  font-size:11px;
  font-weight:800;
}

/* PAGINATION */

.pagination{
  display:flex;
  justify-content:center;
  gap:6px;
  margin-top:30px;
}

.page-btn{
  min-width:37px;
  height:37px;
  padding:0 12px;
  border-radius:9px;
  background:#161a22;
  color:#dce0e6;
  border:1px solid var(--border);
  font-size:12px;
  font-weight:700;
}

.page-btn:hover{
  background:#222832;
}

.page-btn.active{
  background:#e8eaed;
  color:#080a0e;
  border-color:#e8eaed;
  font-weight:800;
}

/* DETAILS PAGE OVERLAY */

.detail-overlay{
  position:fixed;
  inset:0;
  z-index:5000;
  background:#080a0e;
  overflow:auto;
}

.detail-back{
  position:fixed;
  z-index:20;
  top:18px;
  left:18px;
  border:1px solid rgba(255,255,255,.16);
  background:rgba(0,0,0,.52);
  color:#fff;
  backdrop-filter:blur(10px);
  border-radius:10px;
  padding:9px 13px;
  font-size:12px;
  font-weight:700;
}

.detail-hero{
  min-height:500px;
  position:relative;
  display:flex;
  align-items:flex-end;
  overflow:hidden;
}

.detail-bg{
  position:absolute;
  z-index:1;
  top:0;
  right:0;
  width:60%;
  height:100%;
  object-fit:cover;
}

.detail-bg-overlay{
  position:absolute;
  z-index:2;
  inset:0;
  background:
    linear-gradient(90deg,#080a0e 0%,rgba(8,10,14,.96) 35%,rgba(8,10,14,.4) 65%,rgba(8,10,14,.08) 100%),
    linear-gradient(0deg,#080a0e 0%,transparent 50%);
}

.detail-main{
  position:relative;
  z-index:3;
  max-width:1450px;
  width:100%;
  margin:auto;
  padding:80px 22px 40px;
  display:flex;
  gap:28px;
}

.detail-info{
  max-width:760px;
}

.detail-title{
  font-size:42px;
  line-height:1.05;
  margin:0 0 12px;
  letter-spacing:-1.2px;
}

.detail-meta{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  font-size:13px;
  color:#d4d8de;
  margin-bottom:15px;
}

.detail-overview{
  color:#d0d4da;
  line-height:1.6;
  font-size:14px;
}

/* UTILS & TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(30px);
  opacity:0;
  z-index:10000;
  background:#eceef1;
  color:#080a0e;
  padding:10px 16px;
  border-radius:9px;
  font-size:12px;
  font-weight:750;
  transition:.25s;
  pointer-events:none;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.to-top{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:1200;
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid #353b46;
  background:#171b23;
  color:#fff;
  font-size:18px;
}

.loading, .empty{
  padding:40px 15px;
  text-align:center;
  color:var(--muted);
}

.spinner{
  width:25px;
  height:25px;
  border:3px solid #303640;
  border-top-color:#fff;
  border-radius:50%;
  margin:0 auto 12px;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* MOBILE NAVIGATION */

#cinevoMobileNav{display:none}

@media(max-width:700px){
  body{padding-bottom:78px}
  
  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .trend-content{
    width:100%;
    padding:20px;
  }

  .trend-bg{
    width:100%;
    opacity:.3;
  }

  .trend-overlay{
    width:100%;
  }

  .search-wrap{
    max-width:none;
  }

  #cinevoMobileNav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:9999;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(13,18,27,.98);
    border-top:1px solid var(--border);
    backdrop-filter:blur(14px);
  }

  #cinevoMobileNav button{
    border:0;
    background:transparent;
    color:#c7ccd5;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    font-size:11px;
    font-weight:700;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo" onclick="goHome()">Cinemo</div>

    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input id="searchInput" class="search" type="search" autocomplete="off" placeholder="Search movies & TV shows...">
      <div id="searchSuggestions" class="search-suggestions hidden"></div>
    </div>
  </div>
</header>

<div class="global-media-filter" id="globalMediaFilter">
  <button type="button" class="global-media-btn active" data-value="all" onclick="setMainMediaType('all')">ALL</button>
  <button type="button" class="global-media-btn" data-value="movie" onclick="setMainMediaType('movie')">MOVIES</button>
  <button type="button" class="global-media-btn" data-value="tv" onclick="setMainMediaType('tv')">TV SHOWS</button>
</div>

<main class="container">

  <!-- TRENDING HERO -->
  <section class="section">
    <div id="trendingBox" class="trending">
      <div class="loading">
        <div class="spinner"></div>
        Loading trending...
      </div>
    </div>
  </section>

  <!-- BROWSE RESULTS -->
  <section class="section">
    <div class="results-head">
      <div>
        <h2 class="section-title" id="resultsTitle">Discover</h2>
      </div>
    </div>

    <div id="results" class="grid"></div>
    <div id="pagination" class="pagination"></div>
  </section>

</main>

<!-- MOBILE NAVIGATION -->
<nav id="cinevoMobileNav">
  <button onclick="goHome()"><span>🏠</span>Home</button>
</nav>

<button id="toTop" class="to-top" title="Back to top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<!-- DETAILS OVERLAY -->
<div id="detailOverlay" class="detail-overlay hidden">
  <button class="detail-back" id="detailBack" onclick="closeDetails()">← Back</button>
  <div id="detailHero" class="detail-hero"></div>
</div>

<div id="toast" class="toast"></div>

<script>
/* ============================================================
   CONFIG & STATE
============================================================ */

const API_KEY = "0d516ae53b334d92b86cfc7c958d192f";
const API_BASE = "https://api.themoviedb.org/3";
const IMG_BASE = "https://image.tmdb.org/t/p/";

const state = {
  page: 1,
  currentResults: [],
  filters: { type: "all" },
  trending: [],
  trendIndex: 0,
  trendTimer: null
};

/* ============================================================
   API FETCH & HELPERS
============================================================ */

async function api(path, params = {}) {
  const url = new URL(API_BASE + path);
  url.searchParams.set("api_key", API_KEY);
  url.searchParams.set("language", "en-US");

  Object.entries(params).forEach(([k, v]) => {
    if (v !== undefined && v !== null && v !== "") url.searchParams.set(k, v);
  });

  const res = await fetch(url);
  if (!res.ok) throw new Error("TMDB fetch error");
  return await res.json();
}

function image(path, size = "w500") {
  return path ? IMG_BASE + size + path : "https://via.placeholder.com/500x750?text=No+Image";
}

function backdrop(path) {
  return path ? IMG_BASE + "original" + path : image(null);
}

function esc(str) {
  return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2000);
}

function goHome() {
  state.filters.type = "all";
  state.page = 1;
  setMainMediaType('all');
  closeDetails();
}

/* ============================================================
   TRENDING & DISCOVER
============================================================ */

async function loadTrending() {
  try {
    const type = state.filters.type === "all" ? "all" : state.filters.type;
    const data = await api(`/trending/${type}/day`);
    state.trending = (data.results || []).slice(0, 5);
    renderTrending();
    startTrendingTimer();
  } catch(e) {
    document.getElementById("trendingBox").innerHTML = `<div class="empty">Unable to load trending data.</div>`;
  }
}

function renderTrending() {
  const box = document.getElementById("trendingBox");
  box.innerHTML = state.trending.map((item, i) => {
    const type = item.media_type || (item.first_air_date ? "tv" : "movie");
    const title = item.title || item.name;
    return `
      <div class="trend-slide ${i === state.trendIndex ? 'active' : ''}">
        <img class="trend-bg" src="${backdrop(item.backdrop_path)}" alt="">
        <div class="trend-overlay"></div>
        <div class="trend-content">
          <div class="trend-type">${type === "tv" ? "TV SHOW" : "MOVIE"}</div>
          <div class="trend-rating-badge">${Math.round((item.vote_average || 0) * 10)}%</div>
          <h2 class="trend-title">${esc(title)}</h2>
          <div class="trend-overview">${esc(item.overview)}</div>
          <button class="trend-btn" onclick="openDetails(${item.id}, '${type}')">View Details</button>
        </div>
      </div>
    `;
  }).join("") + `
    <button class="trend-arrow trend-prev" onclick="changeTrend(-1)">‹</button>
    <button class="trend-arrow trend-next" onclick="changeTrend(1)">›</button>
  `;
}

function changeTrend(dir) {
  if(!state.trending.length) return;
  state.trendIndex = (state.trendIndex + dir + state.trending.length) % state.trending.length;
  document.querySelectorAll(".trend-slide").forEach((el, i) => {
    el.classList.toggle("active", i === state.trendIndex);
  });
}

function startTrendingTimer() {
  clearInterval(state.trendTimer);
  state.trendTimer = setInterval(() => changeTrend(1), 5000);
}

async function loadBrowse() {
  const container = document.getElementById("results");
  container.innerHTML = `<div class="loading"><div class="spinner"></div>Loading titles...</div>`;

  try {
    const endpoint = state.filters.type === "tv" ? "/discover/tv" : "/discover/movie";
    let results = [];

    if (state.filters.type === "all") {
      const [m, t] = await Promise.all([
        api("/discover/movie", { page: state.page }),
        api("/discover/tv", { page: state.page })
      ]);
      results = [...(m.results || []).map(r=>({...r, media_type:"movie"})), ...(t.results || []).map(r=>({...r, media_type:"tv"}))];
      results.sort((a,b) => b.popularity - a.popularity);
    } else {
      const res = await api(endpoint, { page: state.page });
      results = (res.results || []).map(r=>({...r, media_type: state.filters.type}));
    }

    state.currentResults = results;
    renderResults();
    renderPagination();
  } catch(e) {
    container.innerHTML = `<div class="empty">Failed to load content.</div>`;
  }
}

function renderResults() {
  const container = document.getElementById("results");
  if (!state.currentResults.length) {
    container.innerHTML = `<div class="empty">No results found.</div>`;
    return;
  }

  container.innerHTML = state.currentResults.map(item => {
    const type = item.media_type || (item.first_air_date ? "tv" : "movie");
    const title = item.title || item.name;
    const pct = Math.round((item.vote_average || 0) * 10);

    return `
      <article class="movie-card" onclick="openDetails(${item.id}, '${type}')">
        <div class="poster-wrap">
          <img class="poster" src="${image(item.poster_path)}" alt="" loading="lazy">
          <div class="poster-type">${type}</div>
          <div class="poster-rating-badge"><span>${pct}</span><small>%</small></div>
        </div>
        <div class="card-body">
          <div class="card-title">${esc(title)}</div>
          <div class="card-actions">
            <button class="details-btn">Details</button>
          </div>
        </div>
      </article>
    `;
  }).join("");
}

function renderPagination() {
  const p = document.getElementById("pagination");
  p.innerHTML = `
    <button class="page-btn" ${state.page <= 1 ? 'disabled style="opacity:0.5"' : ''} onclick="changePage(-1)">← Previous</button>
    <span class="page-btn active">${state.page}</span>
    <button class="page-btn" onclick="changePage(1)">Next →</button>
  `;
}

function changePage(dir) {
  state.page += dir;
  loadBrowse();
  window.scrollTo({top: 400, behavior: "smooth"});
}

function setMainMediaType(type) {
  state.filters.type = type;
  state.page = 1;
  document.querySelectorAll(".global-media-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.value === type);
  });
  loadTrending();
  loadBrowse();
}

/* ============================================================
   DETAILS VIEW
============================================================ */

async function openDetails(id, type) {
  const overlay = document.getElementById("detailOverlay");
  overlay.classList.remove("hidden");
  document.body.style.overflow = "hidden";

  const hero = document.getElementById("detailHero");
  hero.innerHTML = `<div class="loading"><div class="spinner"></div>Loading details...</div>`;

  try {
    const data = await api(`/${type}/${id}`);
    const title = data.title || data.name;

    hero.innerHTML = `
      <img class="detail-bg" src="${backdrop(data.backdrop_path)}" alt="">
      <div class="detail-bg-overlay"></div>
      <div class="detail-main">
        <div class="detail-info">
          <h1 class="detail-title">${esc(title)}</h1>
          <div class="detail-meta">
            <span>⭐ ${Math.round((data.vote_average || 0) * 10)}%</span>
            <span>📅 ${data.release_date || data.first_air_date || 'N/A'}</span>
          </div>
          <div class="detail-overview">${esc(data.overview)}</div>
        </div>
      </div>
    `;
  } catch(e) {
    hero.innerHTML = `<div class="empty">Failed to load content.</div>`;
  }
}

function closeDetails() {
  document.getElementById("detailOverlay").classList.add("hidden");
  document.body.style.overflow = "";
}

/* ============================================================
   SEARCH SUGGESTIONS
============================================================ */

const searchInput = document.getElementById("searchInput");
const searchSuggestions = document.getElementById("searchSuggestions");

searchInput.addEventListener("input", async (e) => {
  const q = e.target.value.trim();
  if (q.length < 2) {
    searchSuggestions.classList.add("hidden");
    return;
  }

  try {
    const data = await api("/search/multi", { query: q });
    const items = (data.results || []).slice(0, 5);

    if (!items.length) {
      searchSuggestions.classList.add("hidden");
      return;
    }

    searchSuggestions.innerHTML = items.map(item => {
      const type = item.media_type;
      if (type !== "movie" && type !== "tv") return "";
      const title = item.title || item.name;
      return `
        <button class="search-suggestion" onclick="openDetails(${item.id}, '${type}')">
          <img src="${image(item.poster_path, 'w185')}" alt="">
          <div>
            <strong>${esc(title)}</strong>
            <small>${type.toUpperCase()} • ${item.release_date || item.first_air_date || ''}</small>
          </div>
        </button>
      `;
    }).join("");

    searchSuggestions.classList.remove("hidden");
  } catch(e) {}
});

/* ============================================================
   INIT
============================================================ */

window.addEventListener("DOMContentLoaded", () => {
  loadTrending();
  loadBrowse();
});
</script>
</body>
</html>
