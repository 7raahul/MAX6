<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CineDB</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Monochrome palette: remaps remaining indigo tint/border/text tokens to white/gray -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        indigo: { 50:'#FFFFFF',100:'#F5F5F5',200:'#E5E5E5',300:'#D4D4D4',400:'#B0B0B0',500:'#FFFFFF',600:'#9A9A9A',700:'#7A7A7A',800:'#5C5C5C',900:'#404040',950:'#1A1A1A' }
                    },
                    // Default Tailwind 'lg' is 1024px — too high. Phones running
                    // "Request Desktop Site" report ~980px, so the desktop
                    // layout (top nav, split modal, scaled-up text) never
                    // triggered there. 900px catches that case reliably.
                    screens: { 'lg': '900px' }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-header {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }
        .glass-card {
            background: rgba(18, 18, 22, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glass-card:active { transform: scale(0.97); }
        .glass-modal {
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        /* No backdrop-filter: used for items repeated inside scrolling
           grids/lists (poster cards, badges, episode cards). backdrop-blur
           on dozens of simultaneously-visible elements is the #1 cause of
           scroll jank on mid-range phones — this keeps the same look
           without the GPU cost. */
        .card-solid {
            background: rgba(15, 15, 18, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .card-solid:active { transform: scale(0.97); }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, rgba(18, 18, 22, 0.8) 25%, rgba(255, 255, 255, 0.15) 50%, rgba(18, 18, 22, 0.8) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        /* Modern slim scrollbar — replaces the default OS scrollbar site-wide.
           .no-scrollbar rows (providers and cast) stay fully hidden as before. */
        html {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.22) transparent;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.32);
            background-clip: padding-box;
        }

        /* Desktop card lift on hover — subtle, GPU-cheap (no blur), pairs with
           the existing group-hover image zoom. */
        .card-solid {
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }
        @media (min-width: 900px) {
            .card-solid:hover {
                transform: translateY(-4px);
                border-color: rgba(255, 255, 255, 0.25);
                box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06);
            }
        }


        /* ================= DESKTOP NAV + HERO REDESIGN =================
           Desktop only. Mobile header, bottom nav and mobile hero are untouched. */
        @media (min-width: 900px) {
            header.glass-header {
                background: rgba(3, 3, 4, 0.94);
                border-bottom: 1px solid rgba(255,255,255,.10);
                box-shadow: 0 8px 30px rgba(0,0,0,.28);
            }

            header.glass-header > div {
                min-height: 58px;
                max-width: 1400px;
            }

            header.glass-header > div > div:first-child {
                gap: 12px;
                min-width: 220px;
            }

            header.glass-header > div > div:first-child > div:first-child {
                width: 42px;
                height: 42px;
                border-radius: 50%;
                box-shadow: 0 7px 24px rgba(255,255,255,.14);
            }

            header.glass-header > div > div:first-child > span {
                font-size: 25px;
                letter-spacing: -.04em;
            }

            .desktop-main-nav {
                position: absolute;
                left: 50%;
                transform: translateX(-50%);
                height: 48px;
                padding: 0;
            }

            .desktop-nav-pill {
                display: flex;
                align-items: center;
                gap: 4px;
                height: 100%;
                padding: 0 5px;
            }

            .desktop-nav-item {
                position: relative;
                height: 44px !important;
                min-width: 88px;
                padding: 0 14px !important;
                border-radius: 10px !important;
                display: inline-flex !important;
                align-items: center !important;
                justify-content: center !important;
                gap: 8px !important;
                color: rgba(226,232,240,.76) !important;
                background: transparent !important;
                font-size: 14px !important;
                font-weight: 750 !important;
                letter-spacing: .005em;
                transition: color .2s ease, background .2s ease, transform .2s ease !important;
            }

            .desktop-nav-item:hover {
                color: #fff !important;
                background: rgba(255,255,255,.065) !important;
                transform: translateY(-1px);
            }

            .desktop-nav-item.active-nav-item,
            #dnav-home.bg-white,
            #dnav-search.bg-white,
            #dnav-home[class*="bg-white"] {
                color: #fff !important;
                background: transparent !important;
                box-shadow: none !important;
            }

            .desktop-nav-item.active-nav-item::after,
            #dnav-home.bg-white::after,
            #dnav-search.bg-white::after {
                content: "";
                position: absolute;
                left: 50%;
                bottom: 2px;
                width: 32px;
                height: 3px;
                transform: translateX(-50%);
                border-radius: 999px;
                background: #fff;
                box-shadow: 0 0 12px rgba(255,255,255,.28);
            }

            .desktop-search-nav-item {
                min-width: 78px;
            }

            .desktop-search-label {
                display: inline;
            }

            .desktop-country-pill {
                position: relative;
                height: 42px;
                min-width: 128px;
                margin-left: 2px;
                padding: 0 11px;
                border: 1px solid rgba(255,255,255,.10);
                border-radius: 11px;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                color: rgba(226,232,240,.82);
                background: rgba(255,255,255,.035);
                transition: border-color .2s ease, background .2s ease, color .2s ease;
            }

            .desktop-country-pill:hover {
                border-color: rgba(255,255,255,.20);
                background: rgba(255,255,255,.07);
                color: #fff;
            }

            #country-select-desktop {
                appearance: none;
                -webkit-appearance: none;
                flex: 1;
                min-width: 0;
                border: 0;
                outline: 0;
                background: transparent;
                color: inherit;
                font-size: 14px;
                font-weight: 750;
                cursor: pointer;
            }

            #country-select-desktop option { background: #0d0d10; color: #fff; }

            .desktop-account-wrap {
                min-width: 220px;
                display: flex;
                justify-content: flex-end;
            }

            .desktop-account-btn {
                height: 42px;
                padding: 0 13px 0 8px;
                border-radius: 13px;
                display: inline-flex;
                align-items: center;
                gap: 9px;
                color: #08080a;
                background: #fff;
                border: 1px solid rgba(255,255,255,.62);
                box-shadow: 0 7px 24px rgba(255,255,255,.10);
                font-size: 14px;
                font-weight: 800;
                transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
            }

            .desktop-account-btn:hover {
                transform: translateY(-1px);
                box-shadow: 0 10px 28px rgba(255,255,255,.17);
            }

            .desktop-account-icon {
                width: 28px;
                height: 28px;
                border-radius: 9px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                background: #08080a;
                color: #fff;
                font-size: 12px;
            }

            .desktop-account-chevron { margin-left: 2px; opacity: .65; }

            .desktop-account-dropdown {
                background: rgba(12,12,15,.97) !important;
                backdrop-filter: blur(18px);
                -webkit-backdrop-filter: blur(18px);
                box-shadow: 0 20px 55px rgba(0,0,0,.55) !important;
            }

            /* DESKTOP HERO: single cinematic backdrop, content-led layout. */
            .desktop-hero-stage {
                position: relative;
                overflow: hidden;
                align-items: stretch;
                background: #050506;
                isolation: isolate;
            }

            .desktop-hero-single {
                position: absolute;
                inset: 0;
                overflow: hidden;
                background: #0a0b0f;
            }

            .desktop-hero-image {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                object-position: center center;
                display: block;
                transform: none;
            }

            .desktop-hero-shade {
                position: absolute;
                inset: 0;
                pointer-events: none;
                background:
                    linear-gradient(90deg, rgba(5,6,8,.96) 0%, rgba(5,6,8,.82) 22%, rgba(5,6,8,.38) 48%, rgba(5,6,8,.05) 78%),
                    linear-gradient(0deg, rgba(5,6,8,.72) 0%, rgba(5,6,8,.08) 42%, rgba(5,6,8,.02) 72%);
            }

            .desktop-hero-info {
                position: absolute;
                left: clamp(34px, 5vw, 76px);
                bottom: clamp(42px, 7vw, 72px);
                width: min(520px, 38vw);
                text-align: left;
                z-index: 2;
            }

            .desktop-hero-logo {
                display: block;
                width: auto;
                max-width: min(390px, 92%);
                max-height: 105px;
                object-fit: contain;
                object-position: left center;
                filter: drop-shadow(0 7px 18px rgba(0,0,0,.72));
                margin-bottom: 14px;
            }

            .desktop-hero-title {
                display: block;
                color: #fff;
                font-size: clamp(32px, 3.6vw, 60px);
                line-height: .98;
                font-weight: 950;
                letter-spacing: -.035em;
                text-shadow: 0 5px 18px rgba(0,0,0,.72);
                margin-bottom: 14px;
            }

            .desktop-hero-meta {
                display: flex;
                align-items: center;
                flex-wrap: wrap;
                gap: 9px;
                margin-top: 0;
                color: rgba(255,255,255,.92);
                font-size: 14px;
                font-weight: 750;
            }

            .desktop-hero-rating {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                padding: 5px 9px;
                border-radius: 8px;
                color: #fbbf24;
                background: rgba(0,0,0,.68);
                border: 1px solid rgba(255,255,255,.13);
            }

            .desktop-hero-overview {
                margin-top: 13px;
                max-width: 500px;
                color: rgba(255,255,255,.78);
                font-size: 13px;
                line-height: 1.48;
                font-weight: 500;
                display: -webkit-box;
                -webkit-box-orient: vertical;
                -webkit-line-clamp: 2;
                overflow: hidden;
                text-shadow: 0 2px 10px rgba(0,0,0,.65);
            }

            .desktop-hero-arrow {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                z-index: 10;
                width: 46px;
                height: 46px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #fff;
                background: rgba(0,0,0,.58);
                border: 1px solid rgba(255,255,255,.20);
                box-shadow: 0 8px 24px rgba(0,0,0,.35);
                transition: background .2s ease, transform .2s ease, border-color .2s ease;
            }

            .desktop-hero-arrow:hover {
                background: #fff;
                color: #08080a;
                border-color: #fff;
            }

            .desktop-hero-arrow-left { left: 18px; }
            .desktop-hero-arrow-right { right: 18px; }

            .desktop-hero-dots {
                position: absolute;
                z-index: 11;
                left: 50%;
                bottom: 14px;
                transform: translateX(-50%);
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .desktop-hero-dot {
                width: 8px;
                height: 8px;
                padding: 0;
                border: 0;
                border-radius: 999px;
                background: rgba(255,255,255,.38);
                transition: width .25s ease, background .25s ease, transform .25s ease;
            }

            .desktop-hero-dot.active {
                width: 30px;
                background: #fff;
            }

            @media (max-width: 1050px) and (min-width: 900px) {
                header.glass-header > div > div:first-child { min-width: 180px; }
                .desktop-account-wrap { min-width: 180px; }
                .desktop-nav-item { min-width: 72px; padding: 0 10px !important; font-size: 12px !important; }
                .desktop-search-label { display: none; }
                .desktop-country-pill { min-width: 110px; }
                .desktop-hero-info { left: 28px; bottom: 34px; width: min(470px, 48vw); }
                .desktop-hero-logo { max-width: 340px; max-height: 88px; }
            }
        }

    </style>
</head>
<body class="bg-[#060608] text-slate-100 font-sans antialiased min-h-screen pb-24 lg:pb-8 select-none bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-indigo-950/40 via-[#060608] to-[#060608]">

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-[100] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Fixed Header -->
    <header class="sticky top-0 z-40 glass-header px-4 lg:px-8 py-3">
      <div class="max-w-7xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-2.5 cursor-pointer" onclick="goHomeAndRefresh()">
            <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-stone-200 via-white to-stone-300 flex items-center justify-center shadow-lg shadow-white/20 border border-white/30">
                <i class="fa-solid fa-play text-slate-950 text-xs font-black"></i>
            </div>
            <span class="text-2xl font-black tracking-wider text-white leading-none">Cine<span class="text-indigo-400">DB</span></span>
        </div>

        <!-- Desktop inline nav (desktop UI only) -->
        <nav class="hidden lg:flex items-center desktop-main-nav" aria-label="Desktop navigation">
            <div class="desktop-nav-pill">
                <button onclick="goHomeDesktop()" id="dnav-home" class="dnav-btn desktop-nav-item active-nav-item" aria-label="Home">
                    <i class="fa-solid fa-house text-[11px]"></i><span>Home</span>
                </button>
                <button onclick="changeCategoryFilter('movie', this)" data-cat="movie" class="dnav-cat-btn desktop-nav-item" aria-label="Movies">
                    <i class="fa-solid fa-film text-[11px]"></i><span>Movies</span>
                </button>
                <button onclick="changeCategoryFilter('tv', this)" data-cat="tv" class="dnav-cat-btn desktop-nav-item" aria-label="TV Shows">
                    <i class="fa-solid fa-tv text-[11px]"></i><span>TV Shows</span>
                </button>
                <button onclick="switchTab('search')" id="dnav-search" title="Search" class="dnav-btn desktop-nav-item desktop-search-nav-item" aria-label="Search">
                    <i class="fa-solid fa-magnifying-glass text-sm"></i><span class="desktop-search-label">Search</span>
                </button>
                <div class="desktop-country-pill">
                    <i class="fa-solid fa-earth-americas text-[12px]"></i>
                    <select id="country-select-desktop" onchange="changeCountryFilter(this.value)" aria-label="Country">
                        <option value="ALL" class="bg-[#0D0D10] text-white">Country</option>
                        <option value="IN" class="bg-[#0D0D10] text-white">🇮🇳 India</option>
                        <option value="US" class="bg-[#0D0D10] text-white">🇺🇸 United States</option>
                        <option value="KR" class="bg-[#0D0D10] text-white">🇰🇷 South Korea</option>
                        <option value="JP" class="bg-[#0D0D10] text-white">🇯🇵 Japan</option>
                        <option value="GB" class="bg-[#0D0D10] text-white">🇬🇧 United Kingdom</option>
                        <option value="ES" class="bg-[#0D0D10] text-white">🇪🇸 Spain</option>
                        <option value="FR" class="bg-[#0D0D10] text-white">🇫🇷 France</option>
                        <option value="DE" class="bg-[#0D0D10] text-white">🇩🇪 Germany</option>
                        <option value="TR" class="bg-[#0D0D10] text-white">🇹🇷 Turkey</option>
                        <option value="CN" class="bg-[#0D0D10] text-white">🇨🇳 China</option>
                        <option value="CA" class="bg-[#0D0D10] text-white">🇨🇦 Canada</option>
                        <option value="BR" class="bg-[#0D0D10] text-white">🇧🇷 Brazil</option>
                        <option value="IT" class="bg-[#0D0D10] text-white">🇮🇹 Italy</option>
                    </select>
                    <i class="fa-solid fa-chevron-down text-[8px] opacity-60 pointer-events-none"></i>
                </div>
            </div>
        </nav>

        <!-- Mobile: single Account icon with Sign In / Sign Up dropdown -->
        <div class="relative flex lg:hidden">
            <button onclick="toggleAccountMenuMobile(event)" id="account-menu-btn-mobile" class="w-9 h-9 rounded-full bg-white text-black flex items-center justify-center shadow-lg shadow-indigo-500/25 border border-indigo-400/30">
                <i class="fa-solid fa-circle-user text-base"></i>
            </button>
            <div id="account-menu-dropdown-mobile" class="hidden absolute top-full right-0 mt-2 w-44 card-solid border border-white/15 rounded-2xl p-2 shadow-2xl z-50">
                <button onclick="closeAccountMenuMobile(); openAuthModal('signin')" class="w-full text-left px-3 py-2.5 rounded-lg text-xs font-semibold text-slate-200 hover:bg-white/10 hover:text-white transition flex items-center gap-2"><i class="fa-solid fa-right-to-bracket text-[11px]"></i> Sign In</button>
                <button onclick="closeAccountMenuMobile(); openAuthModal('signup')" class="w-full text-left px-3 py-2.5 rounded-lg text-xs font-semibold text-slate-200 hover:bg-white/10 hover:text-white transition flex items-center gap-2"><i class="fa-solid fa-user-plus text-[11px]"></i> Sign Up</button>
            </div>
        </div>

        <!-- Desktop account control (desktop UI only) -->
        <div class="hidden lg:block relative desktop-account-wrap">
            <button onclick="toggleAccountMenu(event)" id="account-menu-btn" class="desktop-account-btn">
                <span class="desktop-account-icon"><i class="fa-solid fa-circle-user"></i></span>
                <span>Account</span>
                <i class="fa-solid fa-chevron-down text-[9px] desktop-account-chevron"></i>
            </button>
            <div id="account-menu-dropdown" class="hidden absolute top-full right-0 mt-3 w-48 card-solid border border-white/15 rounded-2xl p-2 shadow-2xl z-50 desktop-account-dropdown">
                <button onclick="closeAccountMenu(); openAuthModal('signin')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-200 hover:bg-white/10 hover:text-white transition flex items-center gap-2"><i class="fa-solid fa-right-to-bracket text-[11px]"></i> Sign In</button>
                <button onclick="closeAccountMenu(); openAuthModal('signup')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-200 hover:bg-white/10 hover:text-white transition flex items-center gap-2"><i class="fa-solid fa-user-plus text-[11px]"></i> Sign Up</button>
            </div>
        </div>
      </div>
    </header>

    <!-- Main Content Tab Area -->
    <main class="p-4 lg:p-8 max-w-7xl mx-auto space-y-5 lg:space-y-8">

        <!-- HOME TAB -->
        <section id="tab-home" class="space-y-4">
            
            <!-- Category & Country Bar (MOBILE ONLY — desktop uses the top-nav controls) -->
            <div class="lg:hidden flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5">
                <div class="flex items-center gap-2">
                    <button onclick="changeCategoryFilter('movie', this)" data-cat="movie" class="cat-btn px-4 py-2 rounded-2xl text-xs font-semibold glass-card text-indigo-200 whitespace-nowrap hover:bg-indigo-500/10 hover:text-white flex items-center gap-1.5 transition"><i class="fa-solid fa-film text-[10px]"></i> Movies</button>
                    <button onclick="changeCategoryFilter('tv', this)" data-cat="tv" class="cat-btn px-4 py-2 rounded-2xl text-xs font-semibold glass-card text-indigo-200 whitespace-nowrap hover:bg-indigo-500/10 hover:text-white flex items-center gap-1.5 transition"><i class="fa-solid fa-tv text-[10px]"></i> TV Shows</button>
                </div>

                <!-- MODERN COUNTRY SELECTOR DROPDOWN -->
                <div class="relative flex-shrink-0 flex items-center glass-card rounded-2xl px-3 py-1.5 border border-indigo-400/30">
                    <i class="fa-solid fa-earth-americas text-indigo-400 text-xs mr-2 pointer-events-none"></i>
                    <select id="country-select" onchange="changeCountryFilter(this.value)" class="bg-transparent text-indigo-200 text-xs font-semibold focus:outline-none cursor-pointer pr-1">
                        <option value="ALL" class="bg-[#0D0D10] text-white">Country</option>
                        <option value="IN" class="bg-[#0D0D10] text-white">🇮🇳 India</option>
                        <option value="US" class="bg-[#0D0D10] text-white">🇺🇸 United States</option>
                        <option value="KR" class="bg-[#0D0D10] text-white">🇰🇷 South Korea</option>
                        <option value="JP" class="bg-[#0D0D10] text-white">🇯🇵 Japan</option>
                        <option value="GB" class="bg-[#0D0D10] text-white">🇬🇧 United Kingdom</option>
                        <option value="ES" class="bg-[#0D0D10] text-white">🇪🇸 Spain</option>
                        <option value="FR" class="bg-[#0D0D10] text-white">🇫🇷 France</option>
                        <option value="DE" class="bg-[#0D0D10] text-white">🇩🇪 Germany</option>
                        <option value="TR" class="bg-[#0D0D10] text-white">🇹🇷 Turkey</option>
                        <option value="CN" class="bg-[#0D0D10] text-white">🇨🇳 China</option>
                        <option value="CA" class="bg-[#0D0D10] text-white">🇨🇦 Canada</option>
                        <option value="BR" class="bg-[#0D0D10] text-white">🇧🇷 Brazil</option>
                        <option value="IT" class="bg-[#0D0D10] text-white">🇮🇹 Italy</option>
                    </select>
                </div>
            </div>

            <!-- HERO SPOTLIGHT -->
            <div class="relative group/hero">
                <div id="hero-container" class="relative rounded-3xl overflow-hidden glass-card border border-indigo-500/20 shadow-2xl aspect-[16/9] lg:aspect-[21/8] lg:max-h-[440px] w-full flex items-end cursor-pointer group transition duration-500">
                    <div class="p-12 text-center w-full text-indigo-300/60 my-auto">

    <script>
        const API_KEY = '9c95420163879f1c4726c540b305cbc6';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const BACKDROP_URL = 'https://image.tmdb.org/t/p/w1280';

        let currentTab = 'home';
        let currentCategory = 'all'; 
        let currentCountry = 'ALL';
        let currentPage = 1;
        let isFetching = false;
        let hasMore = true;
        let searchTimeout = null;
        let searchInitialized = false;

        let heroItems = [];
        let heroIndex = 0;
        let heroTimer = null;
        let heroEnrichToken = 0;
        let pendingItem = null;
        let pendingKey = null;
        let pendingQuickBookmark = false;

        document.addEventListener('DOMContentLoaded', () => {
            loadHomeTitles(true);
            setupHistoryState();
            setupInfiniteScroll();
            checkShareableLink();
        });

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'glass-card px-4 py-2.5 rounded-2xl text-xs font-semibold text-white border border-indigo-500/30 shadow-2xl flex items-center gap-2 transform transition-all duration-300 translate-y-5 opacity-0 pointer-events-auto';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-indigo-400 text-sm"></i> <span>${msg}</span>`;
            container.appendChild(toast);

            setTimeout(() => toast.classList.remove('translate-y-5', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function openAuthModal(mode) {
            switchAuthMode(mode);
            document.getElementById('auth-modal').classList.remove('hidden');
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').classList.add('hidden');
        }

        function switchAuthMode(mode) {
            const isSignIn = mode === 'signin';
            document.getElementById('form-signin').classList.toggle('hidden', !isSignIn);
            document.getElementById('form-signup').classList.toggle('hidden', isSignIn);

            const tabSignIn = document.getElementById('auth-tab-signin');
            const tabSignUp = document.getElementById('auth-tab-signup');

            if (isSignIn) {
                tabSignIn.className = "text-sm font-bold text-indigo-400 border-b-2 border-indigo-400 pb-1";
                tabSignUp.className = "text-sm font-bold text-slate-400 hover:text-white pb-1";
            } else {
                tabSignUp.className = "text-sm font-bold text-indigo-400 border-b-2 border-indigo-400 pb-1";
                tabSignIn.className = "text-sm font-bold text-slate-400 hover:text-white pb-1";
            }
        }

        function handleAuthSubmit(type) {
            closeAuthModal();
            showToast(type === 'signin' ? 'Signed in successfully!' : 'Account created successfully!');
        }

        function checkShareableLink() {
            const params = new URLSearchParams(window.location.search);
            const sharedId = params.get('id');
            const sharedType = params.get('type');
            if (sharedId && sharedType) openDetails(sharedType, sharedId);
        }

        function setupHistoryState() {
            window.history.replaceState({ modalOpen: false, tab: 'home' }, '');
            window.addEventListener('popstate', (e) => {
                const modal = document.getElementById('details-modal');
                if (!modal.classList.contains('hidden')) {
                    closeModalDOM();
                } else if (e.state && e.state.tab) {
                    switchTabDOM(e.state.tab);
                }
            });
        }

        function switchTab(tabName) {
            // Close any open modals first — otherwise the tab switches
            // behind the modal and it looks like the nav button did nothing.
            const detailsModal = document.getElementById('details-modal');
            if (detailsModal && !detailsModal.classList.contains('hidden')) {
                closeModalDOM();
            }
            const actorModal = document.getElementById('actor-modal');
            if (actorModal && !actorModal.classList.contains('hidden')) {
                closeActorModal();
            }

            if (currentTab === tabName && tabName !== 'home') return;
            window.history.pushState({ modalOpen: false, tab: tabName }, '');
            switchTabDOM(tabName);
        }

        function switchTabDOM(tabName) {
            currentTab = tabName;
            if (tabName !== 'search') document.title = 'CineDB';

            const inactiveClass = "nav-btn flex flex-col items-center gap-1 px-3 py-1.5 rounded-full text-stone-400 hover:text-white transition-all duration-300";
            const activeClass = "nav-btn flex flex-row items-center gap-2 px-4 py-2.5 rounded-full bg-white text-black font-bold transition-all duration-300 shadow-lg";
            const dInactiveClass = "dnav-btn desktop-nav-item px-4 py-2 rounded-xl text-sm font-semibold text-slate-300 hover:text-white hover:bg-white/10 transition";
            const dActiveClass = "dnav-btn desktop-nav-item px-4 py-2 rounded-xl text-sm font-bold bg-white text-black transition";

            ['home', 'search'].forEach(tab => {
                const tabEl = document.getElementById(`tab-${tab}`);
                const navEl = document.getElementById(`nav-${tab}`);
                const dnavEl = document.getElementById(`dnav-${tab}`);

                if (tabEl) tabEl.classList.add('hidden');
                if (navEl) navEl.className = inactiveClass;
                if (dnavEl) dnavEl.className = dInactiveClass;
            });

            const activeTabEl = document.getElementById(`tab-${tabName}`);
            const activeNavEl = document.getElementById(`nav-${tabName}`);
            const activeDnavEl = document.getElementById(`dnav-${tabName}`);

            if (activeTabEl) activeTabEl.classList.remove('hidden');
            if (activeNavEl) activeNavEl.className = activeClass;
            if (activeDnavEl) activeDnavEl.className = dActiveClass;
            if (tabName === 'search' && !searchInitialized) {
                searchInitialized = true;
                renderRecentSearches();
                handleSearch();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function fetchTMDB(endpoint, params = '') {
            const cacheKey = `cinedb_cache_${endpoint}_${params}`;
            const cached = sessionStorage.getItem(cacheKey);
            if (cached) return JSON.parse(cached);

            try {
                const res = await fetch(`${BASE_URL}${endpoint}?api_key=${API_KEY}${params}`);
                const data = await res.json();
                if (data) sessionStorage.setItem(cacheKey, JSON.stringify(data));
                return data;
            } catch (err) {
                console.error("API Fetch Error:", err);
                return null;
            }
        }

        async function fetchTitleLogo(type, id) {
            try {
                const data = await fetchTMDB(`/${type}/${id}/images`, '&include_image_language=en,hi,null');
                if (data && data.logos && data.logos.length > 0) {
                    const logo = data.logos.find(l => l.iso_639_1 === 'en' || l.iso_639_1 === 'hi') || data.logos[0];
                    return `${IMG_URL}${logo.file_path}`;
                }
            } catch (e) { console.error(e); }
            return null;
        }

        // India + TV Shows should surface OTT web series, not daily-soap TV serials.
        // TMDB has no "web series only" flag, so we resolve the actual Indian OTT
        // platform IDs from /watch/providers/tv (name-matched, not hardcoded) and
        // filter discover/tv to only those with_watch_providers.
        let indianOttProviderIdsCache = null;
        const INDIAN_OTT_NAME_PATTERNS = ['netflix', 'prime video', 'amazon', 'hotstar', 'jiocinema', 'jio cinema', 'sonyliv', 'sony liv', 'zee5', 'mx player', 'voot', 'aha', 'hoichoi', 'lionsgate play', 'apple tv', 'mubi', 'erosnow', 'eros now'];
        async function getIndianOttProviderIds() {
            if (indianOttProviderIdsCache) return indianOttProviderIdsCache;
            const data = await fetchTMDB('/watch/providers/tv', '&watch_region=IN');
            if (data && data.results && data.results.length) {
                const ids = data.results
                    .filter(p => INDIAN_OTT_NAME_PATTERNS.some(pat => p.provider_name.toLowerCase().includes(pat)))
                    .map(p => p.provider_id);
                indianOttProviderIdsCache = ids.length ? ids : [8, 119, 232];
            } else {
                indianOttProviderIdsCache = [8, 119, 232]; // fallback: Netflix, Prime Video, ZEE5
            }
            return indianOttProviderIdsCache;
        }

        function changeCategoryFilter(category, btnEl) {
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.className = "cat-btn px-4 py-2 rounded-2xl text-xs font-semibold glass-card text-indigo-200 whitespace-nowrap hover:bg-indigo-500/10 hover:text-white flex items-center gap-1.5 transition";
            });
            document.querySelectorAll('.dnav-cat-btn').forEach(b => {
                b.className = "dnav-cat-btn desktop-nav-item px-4 py-2 rounded-xl text-sm font-semibold text-slate-300 hover:text-white hover:bg-white/10 transition flex items-center gap-2";
            });
            document.querySelectorAll(`[data-cat="${category}"]`).forEach(b => {
                if (b.classList.contains('dnav-cat-btn')) {
                    b.className = "dnav-cat-btn desktop-nav-item px-4 py-2 rounded-xl text-sm font-bold bg-white text-black shadow-lg shadow-indigo-500/25 transition flex items-center gap-2";
                } else {
                    b.className = "cat-btn active px-4 py-2 rounded-2xl text-xs font-bold bg-white text-black shadow-lg shadow-indigo-500/25 whitespace-nowrap border border-indigo-400/30 flex items-center gap-1.5 transition";
                }
            });

            currentCategory = category;
            updateSectionTitle();
            loadHomeTitles(true);
        }

        function goHomeDesktop() {
            currentCategory = 'all';
            currentCountry = 'ALL';

            document.querySelectorAll('.cat-btn').forEach(b => {
                b.className = "cat-btn px-4 py-2 rounded-2xl text-xs font-semibold glass-card text-indigo-200 whitespace-nowrap hover:bg-indigo-500/10 hover:text-white flex items-center gap-1.5 transition";
            });
            document.querySelectorAll('.dnav-cat-btn').forEach(b => {
                b.className = "dnav-cat-btn desktop-nav-item px-4 py-2 rounded-xl text-sm font-semibold text-slate-300 hover:text-white hover:bg-white/10 transition flex items-center gap-2";
            });
            document.querySelectorAll('[data-cat="all"]').forEach(b => {
                b.className = "cat-btn active px-4 py-2 rounded-2xl text-xs font-bold bg-white text-black shadow-lg shadow-indigo-500/25 whitespace-nowrap border border-indigo-400/30 flex items-center gap-1.5 transition";
            });

            const mobileSel = document.getElementById('country-select');
            const desktopSel = document.getElementById('country-select-desktop');
            if (mobileSel) mobileSel.value = 'ALL';
            if (desktopSel) desktopSel.value = 'ALL';
switchTab('home');
            updateSectionTitle();
            loadHomeTitles(true);
        }

        // Logo click = Home + full refresh (alias, same full-reset behavior)
        function goHomeAndRefresh() {
            goHomeDesktop();
        }

        function changeCountryFilter(countryCode) {
            currentCountry = countryCode;
            const mobileSel = document.getElementById('country-select');
            const desktopSel = document.getElementById('country-select-desktop');
            if (mobileSel) mobileSel.value = countryCode;
            if (desktopSel) desktopSel.value = countryCode;

            loadHomeTitles(true);

        function toggleAccountMenu(e) {

            const accountDropdown = document.getElementById('account-menu-dropdown');
            const accountBtn = document.getElementById('account-menu-btn');

            const accountDropdownM = document.getElementById('account-menu-dropdown-mobile');

        function selectHeroIndex(index, e) {
            if (e) e.stopPropagation();
            if (!heroItems.length) return;
            heroIndex = ((index % heroItems.length) + heroItems.length) % heroItems.length;
            startHeroAutoSlide();
        }

        function heroPrev(e) {
            e.stopPropagation();
            if (!heroItems.length) return;
            heroIndex = (heroIndex - 1 + heroItems.length) % heroItems.length;
            startHeroAutoSlide();
        }
        function heroNext(e) {
            e.stopPropagation();
            if (!heroItems.length) return;
            heroIndex = (heroIndex + 1) % heroItems.length;
            startHeroAutoSlide();
        }

        function renderTop10(items) {
            const section = document.getElementById('top10-section');
            if (!section) return;
            if (!items.length) { section.innerHTML = ''; return; }
            section.innerHTML = `
                <h2 class="text-base font-bold text-white tracking-wide flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-indigo-400"></span> Trending Now
                </h2>
                <div class="flex gap-6 overflow-x-auto no-scrollbar pb-2 pt-1">
                    ${items.map((item, idx) => {
                        const type = item.media_type || (item.title ? 'movie' : 'tv');
                        const title = item.title || item.name || 'Untitled';
                        const poster = item.poster_path ? `${IMG_URL}${item.poster_path}` : 'https://via.placeholder.com/300x450?text=No+Image';
                        return `
                            <div onclick="openDetails('${type}', ${item.id})" class="relative flex-none flex items-end cursor-pointer group pl-8">
                                <div class="relative z-0 w-28 aspect-[2/3] rounded-xl overflow-hidden border border-white/10 shadow-xl group-hover:border-white/30 transition">
                                    <img src="${poster}" alt="${title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
                                </div>
                                <span class="absolute left-0 bottom-0 z-10 text-[90px] font-black leading-none select-none text-transparent pointer-events-none" style="-webkit-text-stroke: 3px rgba(255,255,255,0.9);">${idx + 1}</span>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }


        function updateSectionTitle() {
            const titles = { all: "Trending Movies & Shows", movie: "Popular Movies", tv: "Popular TV Shows" };
            let titleText = titles[currentCategory] || "Trending Titles";
            if (currentCountry !== 'ALL') titleText += ` (${currentCountry})`;
            document.getElementById('section-title').innerHTML = `<span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span> ${titleText}`;
        }

        function setupInfiniteScroll() {
            let ticking = false;
            window.addEventListener('scroll', () => {
                if (ticking) return;
                ticking = true;
                requestAnimationFrame(() => {
                    if (currentTab === 'home' && !isFetching && hasMore) {
                        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 600) {
                            loadHomeTitles(false);
                        }
                    }
                    ticking = false;
                });
            }, { passive: true });
        }

        async function loadHomeTitles(reset = false) {
            if (isFetching) return;
            isFetching = true;

            if (reset) {
                currentPage = 1;
                hasMore = true;
                showGridSkeleton('home-grid');
            } else {
                document.getElementById('infinite-loader').classList.remove('hidden');
            }

            let endpoint = '/trending/all/day';
            let params = `&page=${currentPage}`;

            if (currentCountry === 'IN' && currentCategory === 'tv') {
                // Web-series-only: filter by actual Indian OTT platforms instead of
                // origin_country (which also returns broadcast TV daily soaps).
                endpoint = '/discover/tv';
                const ottIds = await getIndianOttProviderIds();
                params += `&watch_region=IN&with_watch_providers=${ottIds.join('|')}&sort_by=popularity.desc`;
            } else if (currentCountry !== 'ALL') {
                endpoint = currentCategory === 'tv' ? '/discover/tv' : '/discover/movie';
                params += `&with_origin_country=${currentCountry}&sort_by=popularity.desc`;
            } else {
                if (currentCategory === 'movie') endpoint = '/trending/movie/day';
                else if (currentCategory === 'tv') endpoint = '/trending/tv/day';

            }

            const data = await fetchTMDB(endpoint, params);
            document.getElementById('infinite-loader').classList.add('hidden');

            if (data && data.results && data.results.length > 0) {
                if (reset) {
                    // Render grid + basic hero IMMEDIATELY — don't block on extra
                    // per-item detail fetches (that was causing filter clicks to
                    // feel broken/unresponsive).
                    heroItems = data.results.slice(0, 5);
                    heroIndex = 0;
                    startHeroAutoSlide();
                    renderTop10(data.results.slice(0, 10));
                    renderGrid(data.results, 'home-grid', false);
                    currentPage++;
                    if (currentPage > data.total_pages) hasMore = false;
                    isFetching = false;

                    // Enrich hero items (logo, runtime, cert, genres) in the
                    // background, then re-render just the hero banner.
                    enrichHeroItems(heroItems);
                    return;
                }
                renderGrid(data.results, 'home-grid', !reset);
                currentPage++;
                if (currentPage > data.total_pages) hasMore = false;
            } else {
                hasMore = false;
                if (reset) {
                    document.getElementById('home-grid').innerHTML = `<div class="col-span-full text-center text-slate-400 py-12 text-xs">No content found for this selection.</div>`;
                }
            }

            isFetching = false;
        }

        async function enrichHeroItems(rawHero) {
            const enrichToken = ++heroEnrichToken;
            const enriched = await Promise.all(rawHero.map(async raw => {
                const hType = raw.media_type || (raw.title ? 'movie' : 'tv');
                const certAppend = hType === 'movie' ? 'release_dates' : 'content_ratings';
                const [details, logoUrl] = await Promise.all([
                    fetchTMDB(`/${hType}/${raw.id}`, `&append_to_response=${certAppend}`),
                    fetchTitleLogo(hType, raw.id)
                ]);
                return { ...raw, _type: hType, _details: details, _logoUrl: logoUrl };
            }));
            // If the user switched filters again while this was in flight, drop it.
            if (enrichToken !== heroEnrichToken) return;
            heroItems = enriched;
            renderHeroBanner(heroItems[heroIndex]);
        }

        function startHeroAutoSlide() {
            if (heroTimer) clearInterval(heroTimer);
            if (!heroItems.length) return;

            renderHeroBanner(heroItems[heroIndex]);

            heroTimer = setInterval(() => {
                heroIndex = (heroIndex + 1) % heroItems.length;
                renderHeroBanner(heroItems[heroIndex]);
            }, 6000);
        }

        function extractCertification(type, details) {
            if (!details) return null;
            try {
                if (type === 'movie' && details.release_dates?.results) {
                    const entry = details.release_dates.results.find(r => r.iso_3166_1 === 'IN')
                        || details.release_dates.results.find(r => r.iso_3166_1 === 'US');
                    const found = entry?.release_dates?.find(rd => rd.certification);
                    return found?.certification || null;
                }
                if (type === 'tv' && details.content_ratings?.results) {
                    const entry = details.content_ratings.results.find(r => r.iso_3166_1 === 'IN')
                        || details.content_ratings.results.find(r => r.iso_3166_1 === 'US');
                    return entry?.rating || null;
                }
            } catch (e) { /* no-op */ }
            return null;
        }

        function renderHeroBanner(item) {

            const title = item.title || item.name;
            const backdrop = item.backdrop_path ? `${BACKDROP_URL}${item.backdrop_path}` : `${IMG_URL}${item.poster_path}`;

            const releaseTime = date !== 'N/A' ? new Date(date).getTime() : 0;

            const runtimeMin = details ? (type === 'movie' ? details.runtime : (details.episode_run_time && details.episode_run_time[0])) : null;
            const runtimeStr = runtimeMin ? `${Math.floor(runtimeMin / 60)}h ${runtimeMin % 60}m` : null;
            const cert = extractCertification(type, details);
            const langCount = details?.spoken_languages?.length || null;
            const genres = (details?.genres || []).slice(0, 4).map(g => g.name);
            const overview = (details?.overview || item.overview || '').trim();

            container.onclick = () => openDetails(type, item.id);

            container.innerHTML = `

                    <div class="flex items-center gap-1.5 text-[11px] font-semibold text-amber-300">

                    </div>
                </div>

                <!-- MOBILE: small pagination dots, bottom-right -->

                <div class="hidden lg:flex absolute inset-0 desktop-hero-stage">

            `;
        }
        

        /* ENHANCED SEARCH LOGIC */
        function getRecentSearches() {
            try { return JSON.parse(localStorage.getItem('cinedb_recent_searches')) || []; } catch (e) { return []; }
        }
        function saveRecentSearch(query) {
            let list = getRecentSearches().filter(q => q.toLowerCase() !== query.toLowerCase());
            list.unshift(query);
            list = list.slice(0, 8);
            localStorage.setItem('cinedb_recent_searches', JSON.stringify(list));
            renderRecentSearches();
        }
        function renderRecentSearches() {
            const wrap = document.getElementById('recent-searches-wrap');
            const row = document.getElementById('recent-searches-row');
            if (!wrap || !row) return;
            const list = getRecentSearches();
            if (!list.length) { wrap.className = "hidden"; row.innerHTML = ''; return; }
            wrap.className = "hidden lg:block";
            row.innerHTML = list.map(q => `
                <button onclick="applyRecentSearch('${q.replace(/'/g, "\\'")}')" class="flex-none px-3 py-1.5 rounded-xl card-solid border border-white/10 text-xs text-slate-300 hover:text-white hover:border-white/30 transition whitespace-nowrap">
                    <i class="fa-regular fa-clock text-[10px] mr-1.5"></i>${q}
                </button>
            `).join('');
        }
        function applyRecentSearch(query) {
            document.getElementById('search-input').value = query;
            handleSearch();
        }
        function clearRecentSearches() {
            localStorage.removeItem('cinedb_recent_searches');
            renderRecentSearches();
        }

        function handleSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(async () => {
                const query = document.getElementById('search-input').value.trim();

                if (query) {
                    saveRecentSearch(query);
                    document.title = `Search: ${query} — CineDB`;
                    window.history.replaceState({ modalOpen: false, tab: 'search' }, '', `${window.location.pathname}?q=${encodeURIComponent(query)}`);
                } else {
                    document.title = 'CineDB';
                    window.history.replaceState({ modalOpen: false, tab: 'search' }, '', window.location.pathname);
                }

                showGridSkeleton('search-grid');

                let endpoint = '/search/multi';
                let params = `&query=${encodeURIComponent(query)}`;

                const data = await fetchTMDB(endpoint, params);
                const results = data?.results || [];

                renderGrid(results, 'search-grid');
            }, 400);
        }


        let renderedCardKeys = {};

        function renderGrid(items, targetId, append = false, refreshOnly = false) {
            const container = document.getElementById(targetId);
            if (!items || items.length === 0) {
                if (!append && !refreshOnly) container.innerHTML = `<div class="col-span-full text-center text-slate-400 py-16 text-xs space-y-2"><i class="fa-regular fa-folder-open text-2xl text-slate-500"></i><p>No saved titles found here.</p></div>`;
                return;
            }

            if (!append) renderedCardKeys[targetId] = new Set();
            if (!renderedCardKeys[targetId]) renderedCardKeys[targetId] = new Set();
            const seenKeys = renderedCardKeys[targetId];


            const html = items.map(item => {
                const type = item.media_type || (item.title ? 'movie' : 'tv');
                const cardKey = `${type}_${item.id}`;
                if (seenKeys.has(cardKey)) return ''; // duplicate across pages — skip
                seenKeys.add(cardKey);

                const title = item.title || item.name || 'Untitled';
                const date = item.release_date || item.first_air_date || 'N/A';
                const year = date !== 'N/A' ? date.split('-')[0] : 'N/A';
                const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
                const poster = item.poster_path ? `${IMG_URL}${item.poster_path}` : 'https://via.placeholder.com/500x750?text=No+Poster';
                const releaseTime = date !== 'N/A' ? new Date(date).getTime() : 0;
                const isNew = releaseTime > 0 && releaseTime <= Date.now() && (Date.now() - releaseTime) < (45 * 24 * 60 * 60 * 1000);
                const itemPayload = JSON.stringify({ id: item.id, title, poster_path: item.poster_path, vote_average: item.vote_average, release_date: date, media_type: type }).replace(/"/g, '&quot;');

                return `
                    <div onclick="openDetails('${type}', ${item.id})" class="card-solid rounded-2xl overflow-hidden transition duration-300 cursor-pointer flex flex-col group relative">

                        <div class="relative aspect-[2/3] bg-[#060608] overflow-hidden">

                                <span>${year}</span>
                            </div>

                    </div>
                `;
            }).join('');

            if (append) container.insertAdjacentHTML('beforeend', html);
            else container.innerHTML = html;
        }

        async function openDetails(type, id) {
            const newUrl = `${window.location.pathname}?type=${type}&id=${id}`;
            window.history.pushState({ modalOpen: true, tab: currentTab, type, id }, '', newUrl);

            const modal = document.getElementById('details-modal');

            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            content.innerHTML = `<div class="p-16 text-center text-slate-400"><i class="fa-solid fa-circle-notch fa-spin text-3xl text-white mb-3"></i><p class="text-xs">Loading details...</p></div>`;

            const [data, logoUrl, similarData] = await Promise.all([
                fetchTMDB(`/${type}/${id}`, '&append_to_response=credits,watch/providers'),

                                    <div class="flex gap-3 overflow-x-auto no-scrollbar pb-2">
                                        ${cast.map(c => {
                                            const photo = c.profile_path ? `${IMG_URL}${c.profile_path}` : 'https://via.placeholder.com/150?text=No+Photo';
                                            return `
                                                <div onclick="openActorModal(${c.id})" class="flex-none w-24 card-solid p-2 rounded-2xl text-center flex flex-col items-center cursor-pointer hover:border-white/30 transition">
                                                    <img src="${photo}" class="w-14 h-14 rounded-full object-cover border border-white/20 mb-2 shadow-md" loading="lazy">
                                                    <p class="text-[11px] font-semibold text-slate-100 truncate w-full">${c.name}</p>
                                                    <p class="text-[9px] text-slate-400 truncate w-full mt-0.5">${c.character || ''}</p>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                </div>
                            ` : ''}

                            ${similarResults.length > 0 ? `
                                <div>
                                    <h3 class="text-xs font-bold text-slate-200 uppercase tracking-wider mb-3">You May Also Like</h3>
                                    <div id="similar-grid" class="grid grid-cols-3 lg:grid-cols-5 gap-3"></div>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;

            if (hasEpisodesTab) {
                loadSeasonEpisodes(id, validSeasons[0].season_number, document.querySelector('.season-btn'));
            }
            if (similarResults.length > 0) {
                renderGrid(similarResults, 'similar-grid');
            }
        }

        function switchDetailTab(tab) {
            ['overview', 'episodes', 'more'].forEach(t => {
                const panel = document.getElementById(`dpanel-${t}`);
                const btn = document.getElementById(`dtab-${t}`);
                if (panel) panel.classList.toggle('hidden', t !== tab);
                if (btn) btn.className = `detail-tab-btn pb-2 text-xs font-bold whitespace-nowrap transition border-b-2 ${t === tab ? 'text-white border-white' : 'text-slate-400 border-transparent'}`;
            });
        }

        async function openActorModal(personId) {
            const modal = document.getElementById('actor-modal');
            const content = document.getElementById('actor-modal-content');
            modal.classList.remove('hidden');

            content.innerHTML = `<div class="p-8 text-center text-indigo-300/60"><i class="fa-solid fa-circle-notch fa-spin text-2xl text-indigo-400 mb-2"></i><p class="text-xs">Loading Actor Profile...</p></div>`;

            const data = await fetchTMDB(`/person/${personId}`, '&append_to_response=combined_credits');
            if (!data) return;

            const photo = data.profile_path ? `${IMG_URL}${data.profile_path}` : 'https://via.placeholder.com/300?text=No+Photo';
            const topWorks = data.combined_credits?.cast?.slice(0, 6) || [];

            content.innerHTML = `
                <div class="flex items-center gap-4 mb-4">
                    <img src="${photo}" class="w-20 h-20 rounded-2xl object-cover border border-indigo-500/30 shadow-lg">
                    <div>
                        <h2 class="text-base font-bold text-white">${data.name}</h2>
                        <p class="text-[11px] text-indigo-400">${data.known_for_department || 'Acting'}</p>
                        <p class="text-[10px] text-slate-400 mt-1"><i class="fa-solid fa-cake-candles mr-1"></i>${data.birthday || 'N/A'}</p>
                    </div>
                </div>
                <div class="space-y-3">
                    <h3 class="text-xs font-bold text-indigo-300 uppercase tracking-wider">Biography</h3>
                    <p class="text-xs text-slate-300 leading-relaxed max-h-32 overflow-y-auto no-scrollbar">${data.biography || 'No biography available.'}</p>
                    
                    <h3 class="text-xs font-bold text-indigo-300 uppercase tracking-wider pt-2">Known For</h3>
                    <div class="grid grid-cols-3 gap-2">
                        ${topWorks.map(w => `
                            <div onclick="closeActorModal(); openDetails('${w.media_type}', ${w.id})" class="card-solid p-1.5 rounded-xl cursor-pointer text-center">
                                <img src="${w.poster_path ? IMG_URL + w.poster_path : 'https://via.placeholder.com/150'}" class="w-full aspect-[2/3] object-cover rounded-lg mb-1">
                                <p class="text-[10px] font-semibold text-white truncate">${w.title || w.name}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function closeActorModal() {
            document.getElementById('actor-modal').classList.add('hidden');
        }

        async function loadSeasonEpisodes(tvId, seasonNumber, btnEl) {
            if (btnEl) {
                document.querySelectorAll('.season-btn').forEach(b => {
                    b.className = "season-btn bg-slate-800/80 text-slate-300 border border-white/10 px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition";
                });
                btnEl.className = "season-btn bg-white text-black border border-white font-bold px-3.5 py-1.5 rounded-xl text-xs whitespace-nowrap transition";
            }

            const container = document.getElementById('episodes-container');
            container.innerHTML = `<div class="py-6 text-center text-slate-400 text-xs"><i class="fa-solid fa-circle-notch fa-spin text-lg text-white mb-1"></i><p>Loading episodes...</p></div>`;

            const data = await fetchTMDB(`/tv/${tvId}/season/${seasonNumber}`);

            if (!data || !data.episodes || data.episodes.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 py-4 text-xs">No episodes found.</p>`;
                return;
            }

            container.className = "grid grid-cols-1 lg:grid-cols-2 gap-4 pt-2";
            container.innerHTML = data.episodes.map(ep => {
                const thumbnail = ep.still_path ? `${IMG_URL}${ep.still_path}` : 'https://via.placeholder.com/400x225?text=No+Thumbnail';
                const rating = ep.vote_average ? ep.vote_average.toFixed(1) : 'N/A';
                const airDate = ep.air_date || 'TBA';
                const runtime = ep.runtime ? `${ep.runtime} min` : null;
                const overview = ep.overview ? ep.overview : 'No description available.';

                return `
                    <div class="card-solid rounded-2xl overflow-hidden border border-white/10 flex flex-col transition hover:border-white/30">
                        <!-- Thumbnail (Left Side) -->
                        <div class="relative aspect-video bg-[#060608] overflow-hidden flex-shrink-0">
                            <img src="${thumbnail}" class="w-full h-full object-cover" loading="lazy">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent"></div>

                            <!-- Episode Number Badge (Top-Left) -->
                            <span class="absolute top-3 left-3 bg-white text-black font-black text-sm px-3 py-1.5 rounded-lg shadow-lg">
                                ${String(ep.episode_number).padStart(2, '0')}
                            </span>

                            <!-- Rating Badge (Top-Right) -->
                            <span class="absolute top-3 right-3 bg-amber-400 text-black font-bold text-[11px] px-2.5 py-1 rounded-lg flex items-center gap-1 shadow-lg">
                                <i class="fa-solid fa-star text-[9px]"></i> ${rating}
                            </span>
                        </div>

                        <!-- Details (Right Side / Below on mobile) -->
                        <div class="p-4 flex-grow flex flex-col justify-between space-y-2.5">
                            <!-- Title -->
                            <h4 class="text-sm font-bold text-white line-clamp-2">${ep.name}</h4>

                            <!-- Meta Info: Date + Runtime -->
                            <div class="flex items-center gap-3 text-xs text-slate-400">
                                <span class="flex items-center gap-1">
                                    <i class="fa-regular fa-calendar text-[10px]"></i> ${airDate}
                                </span>
                                ${runtime ? `<span class="text-slate-500">•</span><span class="flex items-center gap-1"><i class="fa-regular fa-clock text-[10px]"></i> ${runtime}</span>` : ''}
                            </div>

                            <!-- Overview -->
                            <p class="text-[13px] text-slate-300 leading-relaxed line-clamp-2 flex-grow">${overview}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function closeModalManual() {
            window.history.back();
        }

        function closeModalDOM() {
            document.getElementById('details-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
            document.title = 'CineDB';
            window.history.pushState({ modalOpen: false, tab: currentTab }, '', window.location.pathname);
        }

        function showGridSkeleton(targetId) {
            document.getElementById(targetId).innerHTML = Array(10).fill(0).map(() => `
                <div class="skeleton rounded-2xl aspect-[2/3] border border-indigo-500/10"></div>
            `).join('');
        }
    </script>
</body>
</html>
