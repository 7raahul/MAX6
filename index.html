<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamHub - Ultra Streaming UI</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d0e12;
            --sidebar-bg: #16181f;
            --card-bg: #1a1c24;
            --accent-yellow: #ffb800;
            --text-main: #ffffff;
            --text-muted: #a0a5b5;
            --pill-bg: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- LEFT FLOATING DOCK (HBO MAX STYLE) --- */
        .sidebar {
            width: 80px;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 0;
            position: fixed;
            height: 100vh;
            z-index: 100;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .sidebar .logo {
            font-size: 24px;
            color: var(--accent-yellow);
            margin-bottom: 50px;
            cursor: pointer;
        }

        .nav-icons {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .nav-icons i {
            font-size: 20px;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-icons i:hover, .nav-icons i.active {
            color: var(--text-main);
            transform: scale(1.1);
        }

        /* --- MAIN CONTAINER --- */
        .main-content {
            margin-left: 80px;
            width: calc(100% - 80px);
            position: relative;
        }

        /* --- HEADER NAVIGATION (HBO MAX PILLS) --- */
        header {
            position: absolute;
            top: 20px;
            left: 40px;
            right: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .nav-pills {
            display: flex;
            gap: 15px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 30px;
        }

        .pill {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .pill.active, .pill:hover {
            background: var(--pill-bg);
            color: var(--text-main);
        }

        .auth-buttons button {
            background: var(--accent-yellow);
            border: none;
            padding: 10px 20px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            color: #000;
        }

        /* --- VIEW CONTROLLERS --- */
        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        /* --- HERO BANNER (NO-STRETCH BACKDROP) --- */
        .hero {
            height: 80vh;
            position: relative;
            background-size: cover;
            background-position: center right;
            display: flex;
            align-items: center;
            padding: 0 60px;
        }

        /* Gradient Overlay for Cinematic Blend */
        .hero-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, #0d0e12 35%, rgba(13, 14, 18, 0.7) 60%, transparent 100%),
                        linear-gradient(0deg, #0d0e12 0%, transparent 40%);
        }

        .hero-details {
            position: relative;
            z-index: 2;
            max-width: 550px;
        }

        .badge-title {
            color: var(--accent-yellow);
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .hero-details h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 15px;
            line-height: 1.1;
        }

        .meta-info {
            display: flex;
            gap: 12px;
            align-items: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .badge-rating {
            background: #333;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
        }

        .overview {
            font-size: 14px;
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 25px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .action-btns {
            display: flex;
            gap: 15px;
        }

        .btn-primary {
            background: var(--accent-yellow);
            color: #000;
            padding: 12px 28px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        /* --- CONTENT RAILS (HOME PAGE) --- */
        .content-section {
            padding: 20px 60px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .media-row {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 20px;
            scrollbar-width: none;
        }

        .media-row::-webkit-scrollbar {
            display: none;
        }

        .media-card {
            min-width: 200px;
            height: 300px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s;
            background: var(--card-bg);
        }

        .media-card:hover {
            transform: scale(1.05);
        }

        .media-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* --- DETAIL PAGE (MGM+ TABBED UI) --- */
        .details-tabs {
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            gap: 30px;
            padding: 0 60px;
            margin-top: 20px;
        }

        .tab-item {
            padding: 15px 0;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 500;
            position: relative;
        }

        .tab-item.active {
            color: var(--text-main);
        }

        .tab-item.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--accent-yellow);
        }

        .tab-content {
            padding: 30px 60px;
        }

        .season-select {
            background: var(--card-bg);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 25px;
            outline: none;
        }

        /* EPISODE CARDS GRID */
        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .episode-card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
        }

        .episode-thumb {
            width: 100%;
            height: 150px;
            position: relative;
        }

        .episode-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .episode-info {
            padding: 15px;
        }

        .episode-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .episode-duration {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* TRAILER MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            width: 80%;
            max-width: 900px;
            height: 500px;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: -40px; right: 0;
            color: #fff; font-size: 24px; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR DOCK -->
    <div class="sidebar">
        <div class="logo"><i class="fa-solid fa-play"></i></div>
        <div class="nav-icons">
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-solid fa-house active" onclick="showView('home-view')"></i>
            <i class="fa-solid fa-bookmark"></i>
            <i class="fa-solid fa-download"></i>
            <i class="fa-solid fa-gear"></i>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="main-content">
        
        <!-- TOP HEADER -->
        <header>
            <div class="nav-pills">
                <span class="pill active" onclick="filterType('all')">Home</span>
                <span class="pill" onclick="filterType('tv')">Series</span>
                <span class="pill" onclick="filterType('movie')">Movies</span>
            </div>
            <div class="auth-buttons">
                <button>Subscribe</button>
            </div>
        </header>

        <!-- VIEW 1: HBO MAX HOMEPAGE -->
        <div id="home-view" class="view active">
            <div class="hero" id="home-hero">
                <div class="hero-overlay"></div>
                <div class="hero-details" id="home-hero-details">
                    <!-- Dynamic Hero Data -->
                </div>
            </div>

            <div class="content-section">
                <h2 class="section-title">Trending Now</h2>
                <div class="media-row" id="trending-row"></div>
            </div>

            <div class="content-section">
                <h2 class="section-title">Popular Series</h2>
                <div class="media-row" id="series-row"></div>
            </div>
        </div>

        <!-- VIEW 2: MGM+ DETAILS PAGE -->
        <div id="detail-view" class="view">
            <div class="hero" id="detail-hero">
                <div class="hero-overlay"></div>
                <div class="hero-details" id="detail-hero-details">
                    <!-- Dynamic Details Hero Data -->
                </div>
            </div>

            <!-- TABBED NAVIGATION -->
            <div class="details-tabs">
                <div class="tab-item active" onclick="switchTab('episodes-tab')">Episodes</div>
                <div class="tab-item" onclick="switchTab('similar-tab')">More Like This</div>
            </div>

            <!-- TAB CONTENT: EPISODES -->
            <div id="episodes-tab" class="tab-content">
                <select class="season-select" id="season-picker" onchange="loadSeasonEpisodes(this.value)">
                    <!-- Seasons populate dynamically -->
                </select>
                <div class="episodes-grid" id="episodes-grid">
                    <!-- Episodes Grid -->
                </div>
            </div>

            <!-- TAB CONTENT: SIMILAR -->
            <div id="similar-tab" class="tab-content" style="display:none;">
                <div class="media-row" id="similar-grid"></div>
            </div>
        </div>

    </div>

    <!-- TRAILER MODAL -->
    <div class="modal" id="trailer-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeTrailer()">&times;</span>
            <iframe id="trailer-frame" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const API_KEY = '842429f43058097b3726a76059639eeb'; // Free TMDB Public Demo Key
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_ORIGINAL = 'https://image.tmdb.org/t/p/original';
        const IMG_W500 = 'https://image.tmdb.org/t/p/w500';

        let currentShowId = null;

        // Initialize App
        async function initApp() {
            loadHomeHero();
            loadRow('/trending/all/week', 'trending-row');
            loadRow('/tv/popular', 'series-row');
        }

        // Fetch & Load Home Hero (HBO Max Style)
        async function loadHomeHero() {
            const res = await fetch(`${BASE_URL}/trending/all/day?api_key=${API_KEY}`);
            const data = await res.json();
            const item = data.results[0]; // Hero Item

            document.getElementById('home-hero').style.backgroundImage = `url(${IMG_ORIGINAL}${item.backdrop_path})`;
            
            const title = item.title || item.name;
            const mediaType = item.media_type === 'tv' ? 'TV Series' : 'Movie';

            document.getElementById('home-hero-details').innerHTML = `
                <div class="badge-title">TMDB ORIGINAL</div>
                <h1>${title}</h1>
                <div class="meta-info">
                    <span class="badge-rating">HD</span>
                    <span>${mediaType}</span>
                    <span><i class="fa-solid fa-star" style="color:var(--accent-yellow)"></i> ${item.vote_average.toFixed(1)}</span>
                </div>
                <p class="overview">${item.overview}</p>
                <div class="action-btns">
                    <button class="btn-primary" onclick="openDetails('${item.id}', '${item.media_type}')"><i class="fa-solid fa-play"></i> Watch Now</button>
                    <button class="btn-icon" onclick="playTrailer('${item.id}', '${item.media_type}')"><i class="fa-solid fa-film"></i></button>
                </div>
            `;
        }

        // Load Horizontal Rows
        async function loadRow(endpoint, elementId) {
            const res = await fetch(`${BASE_URL}${endpoint}?api_key=${API_KEY}`);
            const data = await res.json();
            const container = document.getElementById(elementId);
            
            container.innerHTML = data.results.map(media => `
                <div class="media-card" onclick="openDetails('${media.id}', '${media.first_air_date ? 'tv' : 'movie'}')">
                    <img src="${IMG_W500}${media.poster_path}" alt="${media.title || media.name}">
                </div>
            `).join('');
        }

        // Open MGM+ Style Details View
        async function openDetails(id, type) {
            currentShowId = id;
            showView('detail-view');

            const res = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}`);
            const item = await res.json();

            // Set High-Res No-Stretch Backdrop Background
            document.getElementById('detail-hero').style.backgroundImage = `url(${IMG_ORIGINAL}${item.backdrop_path})`;

            const title = item.title || item.name;
            const releaseYear = (item.release_date || item.first_air_date || '').split('-')[0];

            document.getElementById('detail-hero-details').innerHTML = `
                <div class="badge-title">${type === 'tv' ? 'MGM+ ORIGINAL SERIES' : 'BLOCKBUSTER MOVIE'}</div>
                <h1>${title}</h1>
                <div class="meta-info">
                    <span class="badge-rating">TV-MA</span>
                    <span>${releaseYear}</span>
                    <span><i class="fa-solid fa-star" style="color:var(--accent-yellow)"></i> ${item.vote_average.toFixed(1)}</span>
                </div>
                <p class="overview">${item.overview}</p>
                <div class="action-btns">
                    <button class="btn-primary"><i class="fa-solid fa-play"></i> Start Watching</button>
                    <button class="btn-icon" onclick="playTrailer('${id}', '${type}')"><i class="fa-solid fa-film"></i></button>
                </div>
            `;

            if (type === 'tv') {
                document.querySelector('.details-tabs').style.display = 'flex';
                setupSeasons(item.seasons);
            } else {
                document.querySelector('.details-tabs').style.display = 'none';
                document.getElementById('episodes-tab').style.display = 'none';
            }
        }

        // Populate Seasons Dropdown
        function setupSeasons(seasons) {
            const picker = document.getElementById('season-picker');
            picker.innerHTML = seasons.map(s => `<option value="${s.season_number}">${s.name}</option>`).join('');
            loadSeasonEpisodes(seasons[0].season_number);
        }

        // Load Episode Grid
        async function loadSeasonEpisodes(seasonNum) {
            const res = await fetch(`${BASE_URL}/tv/${currentShowId}/season/${seasonNum}?api_key=${API_KEY}`);
            const data = await res.json();
            
            const grid = document.getElementById('episodes-grid');
            grid.innerHTML = data.episodes.map(ep => `
                <div class="episode-card">
                    <div class="episode-thumb">
                        <img src="${ep.still_path ? IMG_W500 + ep.still_path : 'https://via.placeholder.com/300x160'}" alt="${ep.name}">
                    </div>
                    <div class="episode-info">
                        <div class="episode-title">${ep.episode_number}. ${ep.name}</div>
                        <div class="episode-duration">${ep.runtime || '45'} min</div>
                    </div>
                </div>
            `).join('');
        }

        // View Switcher
        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            window.scrollTo(0, 0);
        }

        // Tab Switcher
        function switchTab(tabId) {
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('episodes-tab').style.display = tabId === 'episodes-tab' ? 'block' : 'none';
            document.getElementById('similar-tab').style.display = tabId === 'similar-tab' ? 'block' : 'none';
        }

        // Trailer Player Modal
        async function playTrailer(id, type) {
            const res = await fetch(`${BASE_URL}/${type}/${id}/videos?api_key=${API_KEY}`);
            const data = await res.json();
            const trailer = data.results.find(v => v.type === 'Trailer' && v.site === 'YouTube');

            if(trailer) {
                document.getElementById('trailer-frame').src = `https://www.youtube.com/embed/${trailer.key}?autoplay=1`;
                document.getElementById('trailer-modal').style.display = 'flex';
            } else {
                alert('Trailer not available for this item.');
            }
        }

        function closeTrailer() {
            document.getElementById('trailer-modal').style.display = 'none';
            document.getElementById('trailer-frame').src = '';
        }

        // Start Application
        initApp();
    </script>
</body>
</html>
