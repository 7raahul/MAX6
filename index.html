<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinemo — Movie & TV Tracker</title>

<style>
:root{
  --bg:#080a0f;
  --panel:#11151e;
  --panel2:#171c28;
  --card:#121620;
  --border:#222834;
  --text:#f3f4f6;
  --muted:#9ca3af;
  --gold:#fbbf24;
  --brand:#10b981;
  --danger:#ef4444;
  --shadow:0 14px 40px rgba(0,0,0,.5);
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding-bottom:40px;
}

button, select, input{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

.hidden{
  display:none!important;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(8,10,15,.92);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}

.nav{
  max-width:1450px;
  margin:auto;
  min-height:70px;
  padding:12px 22px;
  display:flex;
  align-items:center;
  gap:18px;
}

.logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:-.5px;
  white-space:nowrap;
  cursor:pointer;
  color:#fff;
}

.logo span{
  color:var(--gold);
}

.search-wrap{
  flex:1;
  max-width:450px;
  position:relative;
}

.search{
  width:100%;
  background:#141822;
  border:1px solid var(--border);
  border-radius:12px;
  color:white;
  outline:none;
  padding:9px 13px 9px 38px;
  height:42px;
  font-size:13px;
}

.search:focus{
  border-color:#4b5563;
}

.search-icon{
  position:absolute;
  left:13px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
  font-size:16px;
}

.search-suggestions{
  position:absolute;
  left:0;
  right:0;
  top:calc(100% + 7px);
  z-index:5000;
  background:#121620;
  border:1px solid var(--border);
  border-radius:12px;
  box-shadow:var(--shadow);
  overflow:hidden;
  max-height:390px;
  overflow-y:auto;
}

.search-suggestion{
  display:flex;
  gap:12px;
  align-items:center;
  padding:10px;
  border:0;
  background:transparent;
  color:#fff;
  width:100%;
  text-align:left;
  cursor:pointer;
}

.search-suggestion:hover{
  background:#1a202c;
}

.search-suggestion img{
  width:36px;
  height:52px;
  object-fit:cover;
  border-radius:6px;
  flex:0 0 36px;
}

.search-suggestion strong{
  font-size:13px;
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.search-suggestion small{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.global-media-filter{
  max-width:1450px;
  margin:0 auto;
  padding:18px 22px 0;
  display:flex;
  align-items:center;
  gap:8px;
}

.global-media-btn{
  border:1px solid var(--border);
  background:#121620;
  color:#9ca3af;
  padding:8px 18px;
  border-radius:10px;
  font-size:12px;
  font-weight:800;
  letter-spacing:.05em;
  cursor:pointer;
  transition:all .2s ease;
}

.global-media-btn:hover{
  background:#1a202c;
  color:#fff;
}

.global-media-btn.active{
  background:#fff;
  border-color:#fff;
  color:#080a0f;
}

/* MAIN CONTAINER & MINIMAL CARDS */

.container{
  max-width:1450px;
  margin:auto;
  padding:20px 22px 60px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:20px;
  margin-top:15px;
}

.movie-card{
  min-width:0;
  cursor:pointer;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  transition:transform .2s,border-color .2s;
}

.movie-card:hover{
  transform:translateY(-4px);
  border-color:#374151;
}

.poster-wrap{
  position:relative;
  aspect-ratio:2/3;
  background:#1a202c;
  overflow:hidden;
}

.poster{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.poster-rating-badge{
  position:absolute;
  top:10px;
  right:10px;
  display:inline-flex;
  align-items:center;
  gap:3px;
  padding:4px 8px;
  border-radius:8px;
  background:rgba(8,10,15,.88);
  border:1px solid rgba(255,255,255,.15);
  color:var(--gold);
  font-size:12px;
  font-weight:800;
  backdrop-filter:blur(6px);
}

.card-body{
  padding:12px;
}

.card-title{
  font-size:13px;
  font-weight:700;
  color:#fff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin:0;
}

/* DETAILS OVERLAY */

.detail-overlay{
  position:fixed;
  inset:0;
  z-index:5000;
  background:#080a0f;
  overflow-y:auto;
}

.detail-back{
  position:fixed;
  z-index:20;
  top:20px;
  left:20px;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(8,10,15,.75);
  color:#fff;
  backdrop-filter:blur(10px);
  border-radius:10px;
  padding:10px 16px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}

.detail-hero{
  position:relative;
  min-height:450px;
  display:flex;
  align-items:flex-end;
  background:#11151e;
}

.detail-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:.35;
}

.detail-bg-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(0deg,#080a0f 0%,rgba(8,10,15,.6) 60%,rgba(8,10,15,.8) 100%);
}

.detail-content{
  position:relative;
  z-index:3;
  max-width:1450px;
  width:100%;
  margin:auto;
  padding:80px 22px 30px;
  display:flex;
  gap:32px;
}

.detail-poster{
  width:240px;
  border-radius:16px;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  flex-shrink:0;
  object-fit:cover;
}

.detail-info{
  flex:1;
}

.detail-title{
  font-size:38px;
  font-weight:900;
  line-height:1.1;
  margin:0 0 10px;
  letter-spacing:-.8px;
}

.detail-meta-row{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:12px;
  font-size:13px;
  color:#d1d5db;
  margin-bottom:18px;
}

.tmdb-rating-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:#1a202c;
  border:1px solid var(--border);
  padding:5px 12px;
  border-radius:8px;
  color:var(--gold);
  font-weight:800;
  font-size:13px;
}

.detail-overview{
  color:#9ca3af;
  line-height:1.6;
  font-size:14px;
  max-width:900px;
  margin-bottom:24px;
}

/* DETAILS METRICS & OTT */

.info-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  margin-bottom:30px;
}

.info-card{
  background:#111520;
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
}

.info-card label{
  display:block;
  font-size:11px;
  font-weight:700;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-bottom:4px;
}

.info-card span{
  font-size:14px;
  font-weight:800;
  color:#fff;
}

.badge-status{
  display:inline-block;
  padding:3px 8px;
  border-radius:6px;
  font-size:11px;
  font-weight:900;
  margin-left:6px;
}
.status-blockbuster{background:#059669;color:#fff}
.status-hit{background:#10b981;color:#000}
.status-avg{background:#d97706;color:#fff}
.status-flop{background:#dc2626;color:#fff}

.ott-section{
  margin-bottom:30px;
}

.ott-title{
  font-size:14px;
  font-weight:800;
  margin-bottom:10px;
  color:#e5e7eb;
}

.ott-logos{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.ott-logo{
  width:42px;
  height:42px;
  border-radius:10px;
  object-fit:cover;
  border:1px solid var(--border);
}

/* CAST SECTION */

.section-block{
  max-width:1450px;
  margin:0 auto 40px;
  padding:0 22px;
}

.block-title{
  font-size:20px;
  font-weight:800;
  margin:0 0 16px;
}

.cast-row{
  display:flex;
  gap:14px;
  overflow-x:auto;
  padding-bottom:10px;
}

.cast-card{
  flex:0 0 110px;
  text-align:center;
}

.cast-img{
  width:110px;
  height:130px;
  object-fit:cover;
  border-radius:12px;
  background:#1a202c;
  margin-bottom:6px;
  border:1px solid var(--border);
}

.cast-name{
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.cast-character{
  font-size:10px;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* TV EPISODE GUIDE */

.season-select-wrap{
  margin-bottom:20px;
}

.season-select{
  background:#111520;
  border:1px solid var(--border);
  color:#fff;
  padding:10px 16px;
  border-radius:10px;
  font-weight:700;
  outline:none;
}

.episodes-list{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.ep-card{
  display:flex;
  gap:16px;
  background:#111520;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
}

.ep-still{
  width:160px;
  aspect-ratio:16/9;
  object-fit:cover;
  border-radius:8px;
  background:#1a202c;
  flex-shrink:0;
}

.ep-info{
  flex:1;
}

.ep-title{
  font-size:14px;
  font-weight:800;
  margin:0 0 4px;
}

.ep-meta{
  font-size:11px;
  color:var(--muted);
  margin-bottom:8px;
  display:flex;
  gap:10px;
}

.ep-overview{
  font-size:12px;
  color:#d1d5db;
  line-height:1.4;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

/* MEDIA SECTION & TABS */

.media-tabs{
  display:flex;
  gap:10px;
  border-bottom:1px solid var(--border);
  margin-bottom:16px;
}

.media-tab-btn{
  background:transparent;
  border:0;
  color:var(--muted);
  padding:8px 14px;
  font-weight:800;
  font-size:13px;
  border-bottom:2px solid transparent;
}

.media-tab-btn.active{
  color:#fff;
  border-color:#fff;
}

.media-gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:12px;
}

.media-item{
  aspect-ratio:16/9;
  border-radius:8px;
  object-fit:cover;
  width:100%;
  background:#1a202c;
  border:1px solid var(--border);
  cursor:pointer;
}

.media-item.poster-type{
  aspect-ratio:2/3;
}

.media-item.logo-type{
  aspect-ratio:16/9;
  object-fit:contain;
  padding:10px;
  background:#111520;
}

/* LIGHTBOX */

.lightbox{
  position:fixed;
  inset:0;
  z-index:9000;
  background:rgba(0,0,0,.92);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.lightbox img{
  max-width:90%;
  max-height:90vh;
  object-fit:contain;
  border-radius:8px;
}

/* UTILS */

.loading, .empty{
  padding:40px 15px;
  text-align:center;
  color:var(--muted);
  grid-column:1 / -1;
}

.spinner{
  width:28px;
  height:28px;
  border:3px solid var(--border);
  border-top-color:#fff;
  border-radius:50%;
  margin:0 auto 12px;
  animation:spin .8s linear infinite;
}

@keyframes spin{ to{transform:rotate(360deg)} }

@media(max-width:768px){
  .grid{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .detail-content{ flex-direction:column; align-items:center; text-align:center; }
  .detail-poster{ width:180px; }
  .detail-meta-row{ justify-content:center; }
  .ep-card{ flex-direction:column; }
  .ep-still{ width:100%; }
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo" onclick="goHome()">Cinemo<span>.</span></div>

    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input id="searchInput" class="search" type="search" autocomplete="off" placeholder="Search movies & TV shows...">
      <div id="searchSuggestions" class="search-suggestions hidden"></div>
    </div>
  </div>
</header>

<div class="global-media-filter" id="globalMediaFilter">
  <button type="button" class="global-media-btn active" data-value="all" onclick="setMainMediaType('all')">ALL</button>
  <button type="button" class="global-media-btn" data-value="movie" onclick="setMainMediaType('movie')">MOVIES</button>
  <button type="button" class="global-media-btn" data-value="tv" onclick="setMainMediaType('tv')">TV SHOWS</button>
</div>

<main class="container">
  <div id="results" class="grid"></div>
  <div id="scrollSentinel" style="height:40px; margin-top:20px;"></div>
</main>

<!-- DETAILS OVERLAY -->
<div id="detailOverlay" class="detail-overlay hidden">
  <button class="detail-back" onclick="closeDetails()">← Back</button>
  <div id="detailBody"></div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox hidden" onclick="this.classList.add('hidden')">
  <img id="lightboxImg" src="" alt="">
</div>

<script>
/* ============================================================
   CONFIG & STATE
============================================================ */

const API_KEY = "0d516ae53b334d92b86cfc7c958d192f";
const API_BASE = "https://api.themoviedb.org/3";
const IMG_BASE = "https://image.tmdb.org/t/p/";

const state = {
  page: 1,
  totalPages: 1,
  type: "all",
  isLoading: false,
  results: [],
  currentMedia: { posters: [], backdrops: [], logos: [] }
};

/* ============================================================
   HELPERS & CONVERTERS
============================================================ */

async function api(path, params = {}) {
  const url = new URL(API_BASE + path);
  url.searchParams.set("api_key", API_KEY);
  url.searchParams.set("language", "en-US");

  Object.entries(params).forEach(([k, v]) => {
    if (v !== undefined && v !== null && v !== "") url.searchParams.set(k, v);
  });

  const res = await fetch(url);
  if (!res.ok) throw new Error("TMDB fetch error");
  return await res.json();
}

function image(path, size = "w500") {
  return path ? IMG_BASE + size + path : "https://via.placeholder.com/500x750?text=No+Image";
}

function esc(str) {
  return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function formatDate(dateStr) {
  if (!dateStr) return 'N/A';
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
}

function formatRuntime(mins) {
  if (!mins) return 'N/A';
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return `${h}h ${m}m`;
}

function formatINR(usdAmount) {
  if (!usdAmount || usdAmount <= 0) return 'N/A';
  const inrCrores = (usdAmount * 83.5) / 10000000;
  return `₹${inrCrores.toFixed(1)} Cr ($${(usdAmount/1000000).toFixed(1)}M)`;
}

function getBoxOfficeStatus(budget, revenue) {
  if (!budget || !revenue || budget <= 0 || revenue <= 0) return null;
  const ratio = revenue / budget;
  if (ratio >= 2.5) return { text: 'BLOCKBUSTER', class: 'status-blockbuster' };
  if (ratio >= 2.0) return { text: 'HIT', class: 'status-hit' };
  if (ratio >= 1.0) return { text: 'AVERAGE', class: 'status-avg' };
  return { text: 'FLOP', class: 'status-flop' };
}

function goHome() {
  state.type = "all";
  state.page = 1;
  state.results = [];
  setMainMediaType('all');
  closeDetails();
}

/* ============================================================
   BROWSE & INFINITE SCROLL
============================================================ */

async function loadBrowse(append = false) {
  if (state.isLoading) return;
  state.isLoading = true;

  const container = document.getElementById("results");
  if (!append) container.innerHTML = `<div class="loading"><div class="spinner"></div>Loading titles...</div>`;

  try {
    let newItems = [];
    if (state.type === "all") {
      const [m, t] = await Promise.all([
        api("/discover/movie", { page: state.page }),
        api("/discover/tv", { page: state.page })
      ]);
      newItems = [
        ...(m.results || []).map(r=>({...r, media_type:"movie"})), 
        ...(t.results || []).map(r=>({...r, media_type:"tv"}))
      ];
      newItems.sort((a,b) => b.popularity - a.popularity);
      state.totalPages = Math.max(m.total_pages || 1, t.total_pages || 1);
    } else {
      const res = await api(`/discover/${state.type}`, { page: state.page });
      newItems = (res.results || []).map(r => ({ ...r, media_type: state.type }));
      state.totalPages = res.total_pages || 1;
    }

    if (!append) state.results = [];
    state.results.push(...newItems);

    renderResults();
  } catch(e) {
    if (!append) container.innerHTML = `<div class="empty">Failed to load content.</div>`;
  } finally {
    state.isLoading = false;
  }
}

function renderResults() {
  const container = document.getElementById("results");
  if (!state.results.length) {
    container.innerHTML = `<div class="empty">No results found.</div>`;
    return;
  }

  /* MINIMAL CARD UI: Poster + Rating (Top-Right) + Title */
  container.innerHTML = state.results.map(item => {
    const type = item.media_type || (item.first_air_date ? "tv" : "movie");
    const title = item.title || item.name;
    const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';

    return `
      <article class="movie-card" onclick="openDetails(${item.id}, '${type}')">
        <div class="poster-wrap">
          <img class="poster" src="${image(item.poster_path)}" alt="" loading="lazy">
          <div class="poster-rating-badge">⭐ ${rating}</div>
        </div>
        <div class="card-body">
          <h3 class="card-title">${esc(title)}</h3>
        </div>
      </article>
    `;
  }).join("");
}

function setupInfiniteScroll() {
  const sentinel = document.getElementById("scrollSentinel");
  const observer = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting && !state.isLoading && state.page < state.totalPages) {
      state.page++;
      loadBrowse(true);
    }
  }, { rootMargin: '300px' });
  observer.observe(sentinel);
}

function setMainMediaType(type) {
  state.type = type;
  state.page = 1;
  state.results = [];
  document.querySelectorAll(".global-media-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.value === type);
  });
  loadBrowse();
}

/* ============================================================
   DETAILS VIEW (MOVIES & TV SHOWS)
============================================================ */

async function openDetails(id, type) {
  const overlay = document.getElementById("detailOverlay");
  const body = document.getElementById("detailBody");
  overlay.classList.remove("hidden");
  document.body.style.overflow = "hidden";

  body.innerHTML = `<div class="loading" style="margin-top:100px"><div class="spinner"></div>Loading details...</div>`;

  try {
    const [data, credits, providers, imagesData] = await Promise.all([
      api(`/${type}/${id}`),
      api(`/${type}/${id}/credits`),
      api(`/${type}/${id}/watch/providers`),
      api(`/${type}/${id}/images`, { include_image_language: 'en,null' })
    ]);

    state.currentMedia = {
      posters: imagesData.posters || [],
      backdrops: imagesData.backdrops || [],
      logos: imagesData.logos || []
    };

    const title = data.title || data.name;
    const releaseDate = formatDate(data.release_date || data.first_air_date);
    const rating = data.vote_average ? data.vote_average.toFixed(1) : 'N/A';
    
    // Director / Creator
    let director = 'N/A';
    if (type === 'movie') {
      const dirObj = (credits.crew || []).find(c => c.job === 'Director');
      if (dirObj) director = dirObj.name;
    } else {
      if (data.created_by && data.created_by.length) {
        director = data.created_by.map(c => c.name).join(', ');
      } else {
        const dirObj = (credits.crew || []).find(c => c.job === 'Director');
        if (dirObj) director = dirObj.name;
      }
    }

    // OTT Providers (India IN)
    const inProviders = providers.results?.IN?.flatrate || providers.results?.IN?.buy || [];

    // Metrics HTML
    let metricsHTML = '';
    if (type === 'movie') {
      const status = getBoxOfficeStatus(data.budget, data.revenue);
      metricsHTML = `
        <div class="info-card">
          <label>Director</label>
          <span>${esc(director)}</span>
        </div>
        <div class="info-card">
          <label>Runtime</label>
          <span>${formatRuntime(data.runtime)}</span>
        </div>
        <div class="info-card">
          <label>Budget</label>
          <span>${formatINR(data.budget)}</span>
        </div>
        <div class="info-card">
          <label>Revenue</label>
          <span>
            ${formatINR(data.revenue)}
            ${status ? `<span class="badge-status ${status.class}">${status.text}</span>` : ''}
          </span>
        </div>
      `;
    } else {
      metricsHTML = `
        <div class="info-card">
          <label>Director / Creator</label>
          <span>${esc(director)}</span>
        </div>
        <div class="info-card">
          <label>Total Seasons</label>
          <span>${data.number_of_seasons || 'N/A'}</span>
        </div>
        <div class="info-card">
          <label>Total Episodes</label>
          <span>${data.number_of_episodes || 'N/A'}</span>
        </div>
      `;
    }

    // Cast HTML
    const castHTML = (credits.cast || []).slice(0, 12).map(c => `
      <div class="cast-card">
        <img class="cast-img" src="${image(c.profile_path, 'w185')}" alt="">
        <div class="cast-name">${esc(c.name)}</div>
        <div class="cast-character">${esc(c.character)}</div>
      </div>
    `).join('');

    body.innerHTML = `
      <div class="detail-hero">
        <img class="detail-bg" src="${image(data.backdrop_path, 'original')}" alt="">
        <div class="detail-bg-overlay"></div>
        <div class="detail-content">
          <img class="detail-poster" src="${image(data.poster_path)}" alt="">
          <div class="detail-info">
            <h1 class="detail-title">${esc(title)}</h1>
            <div class="detail-meta-row">
              <div class="tmdb-rating-pill">⭐ ${rating} / 10</div>
              <span>📅 ${releaseDate}</span>
              <span>• ${type.toUpperCase()}</span>
            </div>
            <p class="detail-overview">${esc(data.overview)}</p>

            ${inProviders.length ? `
              <div class="ott-section">
                <div class="ott-title">Available On (India)</div>
                <div class="ott-logos">
                  ${inProviders.map(p => `<img class="ott-logo" src="${IMG_BASE + 'w92' + p.logo_path}" title="${esc(p.provider_name)}">`).join('')}
                </div>
              </div>
            ` : ''}

            <div class="info-grid">
              ${metricsHTML}
            </div>
          </div>
        </div>
      </div>

      <!-- CAST SECTION -->
      <section class="section-block">
        <h2 class="block-title">Top Cast</h2>
        <div class="cast-row">
          ${castHTML || '<div class="empty">No cast info available.</div>'}
        </div>
      </section>

      <!-- TV SHOW SEASON & EPISODE GUIDE -->
      ${type === 'tv' ? `
        <section class="section-block">
          <h2 class="block-title">Season & Episode Guide</h2>
          <div class="season-select-wrap">
            <select id="seasonSelect" class="season-select" onchange="loadSeasonEpisodes(${id}, this.value)">
              ${Array.from({length: data.number_of_seasons || 1}, (_, i) => `<option value="${i+1}">Season ${i+1}</option>`).join('')}
            </select>
          </div>
          <div id="episodesList" class="episodes-list"></div>
        </section>
      ` : ''}

      <!-- MEDIA SECTION -->
      <section class="section-block">
        <h2 class="block-title">Media & Visuals</h2>
        <div class="media-tabs">
          <button class="media-tab-btn active" onclick="switchMediaTab('backdrops', this)">Backdrops (${state.currentMedia.backdrops.length})</button>
          <button class="media-tab-btn" onclick="switchMediaTab('posters', this)">Posters (${state.currentMedia.posters.length})</button>
          <button class="media-tab-btn" onclick="switchMediaTab('logos', this)">Logos (${state.currentMedia.logos.length})</button>
        </div>
        <div id="mediaGallery" class="media-gallery"></div>
      </section>
    `;

    if (type === 'tv') loadSeasonEpisodes(id, 1);
    switchMediaTab('backdrops', document.querySelector('.media-tab-btn'));

  } catch(e) {
    body.innerHTML = `<div class="empty" style="margin-top:100px">Failed to load details.</div>`;
  }
}

function closeDetails() {
  document.getElementById("detailOverlay").classList.add("hidden");
  document.body.style.overflow = "";
}

/* ============================================================
   TV SHOW EPISODES
============================================================ */

async function loadSeasonEpisodes(tvId, seasonNum) {
  const container = document.getElementById("episodesList");
  container.innerHTML = `<div class="loading"><div class="spinner"></div>Loading episodes...</div>`;

  try {
    const data = await api(`/tv/${tvId}/season/${seasonNum}`);
    container.innerHTML = (data.episodes || []).map(ep => `
      <div class="ep-card">
        <img class="ep-still" src="${image(ep.still_path, 'w300')}" alt="">
        <div class="ep-info">
          <h4 class="ep-title">E${ep.episode_number}. ${esc(ep.name)}</h4>
          <div class="ep-meta">
            <span>📅 ${formatDate(ep.air_date)}</span>
            <span>⭐ ${ep.vote_average ? ep.vote_average.toFixed(1) : 'N/A'}</span>
          </div>
          <div class="ep-overview">${esc(ep.overview || 'No description available.')}</div>
        </div>
      </div>
    `).join('') || `<div class="empty">No episode details found.</div>`;
  } catch(e) {
    container.innerHTML = `<div class="empty">Failed to load season episodes.</div>`;
  }
}

/* ============================================================
   MEDIA GALLERY & LIGHTBOX
============================================================ */

function switchMediaTab(category, btnEl) {
  document.querySelectorAll('.media-tab-btn').forEach(b => b.classList.remove('active'));
  if (btnEl) btnEl.classList.add('active');

  const gallery = document.getElementById("mediaGallery");
  const items = state.currentMedia[category] || [];

  if (!items.length) {
    gallery.innerHTML = `<div class="empty">No ${category} available.</div>`;
    return;
  }

  gallery.innerHTML = items.slice(0, 18).map(m => {
    const imgUrl = image(m.file_path, category === 'logos' ? 'w500' : 'w780');
    const typeClass = category === 'posters' ? 'poster-type' : (category === 'logos' ? 'logo-type' : '');
    return `
      <img class="media-item ${typeClass}" src="${imgUrl}" onclick="openLightbox('${image(m.file_path, 'original')}')" loading="lazy">
    `;
  }).join('');
}

function openLightbox(src) {
  const lb = document.getElementById("lightbox");
  document.getElementById("lightboxImg").src = src;
  lb.classList.remove("hidden");
}

/* ============================================================
   SEARCH SUGGESTIONS
============================================================ */

const searchInput = document.getElementById("searchInput");
const searchSuggestions = document.getElementById("searchSuggestions");

searchInput.addEventListener("input", async (e) => {
  const q = e.target.value.trim();
  if (q.length < 2) {
    searchSuggestions.classList.add("hidden");
    return;
  }

  try {
    const data = await api("/search/multi", { query: q });
    const items = (data.results || []).filter(i => i.media_type === 'movie' || i.media_type === 'tv').slice(0, 5);

    if (!items.length) {
      searchSuggestions.classList.add("hidden");
      return;
    }

    searchSuggestions.innerHTML = items.map(item => {
      const type = item.media_type;
      const title = item.title || item.name;
      const date = formatDate(item.release_date || item.first_air_date);
      return `
        <button class="search-suggestion" onclick="openDetails(${item.id}, '${type}')">
          <img src="${image(item.poster_path, 'w185')}" alt="">
          <div>
            <strong>${esc(title)}</strong>
            <small>${type.toUpperCase()} • ${date}</small>
          </div>
        </button>
      `;
    }).join("");

    searchSuggestions.classList.remove("hidden");
  } catch(e) {}
});

document.addEventListener("click", (e) => {
  if (!searchInput.contains(e.target) && !searchSuggestions.contains(e.target)) {
    searchSuggestions.classList.add("hidden");
  }
});

/* ============================================================
   INIT
============================================================ */

window.addEventListener("DOMContentLoaded", () => {
  loadBrowse();
  setupInfiniteScroll();
});
</script>
